<app-work-space-layout [headerVisible]="false">

    <div main-content class="h-full max-h-full flex flex-col overflow-hidden">
        @if(productionOrder()){

            <app-work-shift-summary [session]="currentSession()" (employeesClick)="openEmployeesSnapshot()" (moduleClick)="openModuleModal()" (shiftClick)="openShiftModal()"></app-work-shift-summary>

            <app-order-header [productionOrder]="productionOrder()"></app-order-header>

            <div class="flex-1 min-h-0 overflow-hidden">
                <app-production-orders-table [productionOrder]="productionOrder()" [currentSession]="currentSession()" (onSelectSKU)="openTaskDialog($event)"></app-production-orders-table>
            </div>

            <div class="flex flex-row justify-end mt-4 gap-3">
                <app-ui-button [intent]="'action'" (onClick)="openBalance()">
                    <app-ui-icon [iconName]="'chartArea'" class="h-5 w-5"></app-ui-icon>
                    Balance del día
                </app-ui-button>
                <app-ui-button (onClick)="goToSearch()">
                    <app-ui-icon [iconName]="'circleLeft'" class="h-5 w-5"></app-ui-icon>
                    Cerrar OP
                </app-ui-button>
            </div>
        }
        @else if(!isLoading()) {
        <app-order-searcher [preloadedDocTypes]="contextDocTypes()" (onFoundDoc)="setDocument($event)"></app-order-searcher>

        <app-last-record-card></app-last-record-card>

        <div class="flex-1 min-h-0 overflow-hidden">
        </div>
        <div class="flex flex-row justify-end mt-4">
            <app-ui-button (onClick)="goToDayOperation()">
                <app-ui-icon [iconName]="'circleLeft'" class="h-5 w-5"></app-ui-icon>
                Anterior
            </app-ui-button>
        </div>
        }
    </div>

</app-work-space-layout>

<app-task-timer [selectedSKU]="selectedSKU()" [workBreaks]="contextWorkBreaks()" (saved)="onTaskSaved()" (started)="onTaskStarted()"></app-task-timer>

<app-employees-modal [visible]="employeesModalVisible()" [employees]="contextEmployees()" [preselectedIds]="preselectedIds()" (onSave)="updateEmployees($event)" (onClose)="employeesModalVisible.set(false)"></app-employees-modal>

<app-module-modal [visible]="moduleModalVisible()" [modules]="contextModules()" [selectedId]="currentSession()?.current_module?.id ?? null" (onClose)="moduleModalVisible.set(false)"></app-module-modal>
 
<app-work-shift-modal [visible]="shiftModalVisible()" [workShifts]="contextWorkShifts()" [selectedId]="currentSession()?.work_shift?.id ?? null" (onClose)="shiftModalVisible.set(false)"></app-work-shift-modal>

<app-balance-bottom-sheet [visible]="balanceVisible()" (onClose)="balanceVisible.set(false)"></app-balance-bottom-sheet>
