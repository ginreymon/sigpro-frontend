<app-panel-layout [padded]="true">

  <div panel-header class="flex flex-col gap-3">

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 sm:gap-0">
      <h1 class="text-xl sm:text-3xl font-semibold text-gray-800 mb-3 mt-3">Estado de Confección</h1>

      <app-efficiency-summary-bar
        [efficiency]="plantaModule().efficiency"
        [status]="plantaModule().status"
        [completed]="plantaModule().total_completed ?? 0"
        [activeModules]="modules().length ? activeModuleCount() : undefined"
        [showFilterButton]="true"
        [filterActive]="showDateFilter()"
        (filterToggle)="toggleDateFilter()">
      </app-efficiency-summary-bar>
    </div>

    @if (showDateFilter()) {
      <div class="bg-slate-50 border border-gray-200 rounded-lg p-4">
        <app-date-range-form></app-date-range-form>
      </div>
    }

  </div>

  <div panel-content>

    <div class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr))">

      @if (modules().length === 0) {
        <div class="bg-white border border-gray-200 rounded-xl p-5 flex flex-col items-center justify-center gap-3 min-h-45 text-gray-300">
          <app-ui-icon iconName="screwdriverWrench" class="h-12 w-12"></app-ui-icon>
          <p class="text-sm text-gray-400 italic">No hay módulos disponibles</p>
        </div>
      } @else {
        @for (mod of allModules(); track mod.module_id) {
          <app-module-efficiency-card [mod]="mod" (cardClick)="openSheet($event)"></app-module-efficiency-card>
        }
      }

    </div>
  </div>

</app-panel-layout>

<app-module-detail-modal
  [visible]="sheetVisible()"
  [module]="selectedModule()"
  (onClose)="closeSheet()">
</app-module-detail-modal>
