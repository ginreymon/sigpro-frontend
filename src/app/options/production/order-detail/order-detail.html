@if(currentSession()){ 
<app-work-space-layout [headerVisible]="false">
  <div main-content class="h-full max-h-full flex flex-col overflow-hidden">

    <app-ui-tabs [tabs]="tabs" [activeKey]="activeTab()" (tabChange)="onTabChange($event)" />

    @if (!productionOrder() && !isLoading()) {
      <div class="flex flex-col items-center justify-center flex-1 gap-3 text-gray-300 py-6">
        <app-ui-icon [iconName]="'magnifyingGlass'" class="h-24 w-24"></app-ui-icon>
        <p class="text-sm text-gray-400">No hay orden seleccionada</p>
      </div>
    }

    @if (productionOrder()) {
      <div [class.hidden]="activeTab() !== 'tab1'" class="flex-1 min-h-0 overflow-hidden flex flex-col">
        <app-order-header class="mt-2" [productionOrder]="productionOrder()" [mobileAccordion]="true"></app-order-header>
        <div class="flex-1 min-h-0 overflow-hidden">
          <app-production-orders-table
            [readOnly]="true"
            [productionOrder]="productionOrder()"
            [currentSession]="currentSession()">
          </app-production-orders-table>
        </div>
      </div>

      <div [class.hidden]="activeTab() !== 'tab2'" class="flex-1 min-h-0 overflow-hidden mt-2">
        <app-materials-table
          [docType]="productionOrder()!.documentType"
          [docNumber]="productionOrder()!.documentNumber">
        </app-materials-table>
      </div>

      <div [class.hidden]="activeTab() !== 'tab3'" class="flex-1 min-h-0 overflow-hidden mt-2">
        <app-sam-goal-calculator
          [samValue]="productionOrder()!.sam ?? null"
          [reference]="productionOrder()!.reference"
          [description]="productionOrder()!.description">
        </app-sam-goal-calculator>
      </div>
    }

    @if (productionOrder()) {
      <div class="flex flex-row justify-end mt-4 gap-3">
        <app-ui-button (onClick)="goToShiftCycles()">
          <app-ui-icon [iconName]="'circleLeft'" class="h-5 w-5"></app-ui-icon>
          Regresar
        </app-ui-button>
      </div>
    }

  </div>
</app-work-space-layout>
}
@if(!currentSession() && !isLoading()){
<div class="-m-6 h-[calc(100vh-4rem)] flex items-center justify-center">
    <app-info-card-template [title]="'Jornada no planificada'"
        [description]="'No has configurado la jornada de trabajo. Asigna un turno, módulo y operarios para poder visualizar los detalles de las órdenes de producción.'">
        <app-ui-button (onClick)="goToDayOperation()">
            <app-ui-icon [iconName]="'circleLeft'" class="h-5 w-5"></app-ui-icon>
            Planificar jornada
        </app-ui-button>
    </app-info-card-template>
</div>
}
