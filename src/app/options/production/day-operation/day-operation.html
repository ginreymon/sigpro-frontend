<app-work-space-layout [headerVisible]="false" [sideContentVisible]="true" [backgroundVisible]="false">
    <div main-content class="h-full flex flex-col justify-between gap-4">

        <!-- Section 1 select module -->
        <div class="h-full bg-white border border-slate-200 rounded-lg shadow-md p-6">
            <div class="flex flex-row justify-between">
                <h4 class="text-xl font-semibold text-gray-700 mb-2">
                    <app-ui-decorator [disabled]="true">1</app-ui-decorator> Seleccionar módulo
                </h4>
                <app-ui-badge [activeText]="'Completado'" [active]="true"></app-ui-badge>
            </div>
        </div>

        <!-- Section 2 select work shift-->
        <div class="h-full bg-white border border-slate-200 rounded-lg shadow-md p-6">
            <div class="flex flex-row justify-between">
                <h4 class="text-xl font-semibold text-gray-700 mb-2">
                    <app-ui-decorator [disabled]="true">2</app-ui-decorator> Seleccionar turno
                </h4>
                <app-ui-badge [inactiveText]="'Incompleto'" [active]="false"></app-ui-badge>
            </div>

        </div>

        <!-- Section 3 seelct teem -->
        <div class="h-full bg-white border border-slate-200 rounded-lg shadow-md p-6">

            <div class="flex flex-row justify-between w-full">
                <h4 class="text-xl font-semibold text-gray-700 mb-2 ">
                    <app-ui-decorator [disabled]="true">3</app-ui-decorator> Confirmar equipo
                </h4>
                <app-ui-badge [activeText]="'Completado'" [active]="true"></app-ui-badge>
            </div>

            <div class="w-full flex flex-row justify-between">
                <div class="w-full">

                </div>
                <div class="w-full">

                </div>
            </div>


        </div>

        <!-- Section 4 (buttons) -->
        <!-- <div [disabled]="true" [className]="'flex flex-col'"> -->
        <!-- <h4 class="text-xl font-semibold text-gray-700 w-full">
                <app-ui-decorator [disabled]="true">4</app-ui-decorator> Iniciar operación
            </h4> -->
        <div class="w-full flex flex-row justify-end gap-4">
            <app-ui-button [intent]="'action'"> Cancelar </app-ui-button>
            <app-ui-button> Iniciar operación </app-ui-button>
        </div>
        <!-- </div> -->

    </div>
</app-work-space-layout>
