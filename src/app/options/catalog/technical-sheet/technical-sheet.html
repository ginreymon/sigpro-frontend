<app-work-space-layout>
  <div main-content class="h-full">
    <app-data-table
      [paginatedResponse]="paginatedResponse()"
      [columns]="columns"
      (onPagerChange)="pagerHandler($event)"
      (onSearch)="searchHandler($event)"
      [actions]="actions"
      (onAction)="actionHandler($event)"
      [tableToolsButtons]="tableToolsButtons">

      <ng-template appTableTemplate="createdAtTemplate" let-row>
        {{ row.created_at | date:'dd/MM/yyyy' }}
      </ng-template>

      <ng-template appTableTemplate="statusTemplate" let-row>
        <app-ui-badge
          [active]="!!(row.status_name?.toLowerCase().includes('elaboracion') || row.status_name?.toLowerCase().includes('elaboración'))"
          [activeText]="(row.status_name ?? '') | titlecase"
          [inactiveText]="(row.status_name ?? '—') | titlecase">
        </app-ui-badge>
      </ng-template>

    </app-data-table>
  </div>
</app-work-space-layout>

<app-side-modal-layout [hideCancel]="true" (onAccept)="closeModelForm()">
  <app-sheet-side-info [sheet]="sheet" [measurements]="measurements()" [elasticCuts]="elasticCuts()"></app-sheet-side-info>
</app-side-modal-layout>

<app-modal-layout  [formId]="'techForm'" [classNames]="'max-w-3xl'" [hideAccept]="true" (onCancel)="closeModelForm()">
  <form id="techForm" [formGroup]="modelForm" (ngSubmit)="submit()">  
    <fieldset [disabled]="showLoader()"> 
      <app-sheet-detail
        #sheetDetail
        [references]="references()"
        [collections]="collections()"
        [statuses]="statuses()"
        [measurements]="measurements()"
        [elasticCuts]="elasticCuts()">

        <app-ui-form-field form-reference [controlName]="'referenceId'" [label]="'Referencia'">
          <app-ui-select [className]="'w-full'" formControlName="referenceId" [id]="'referenceId'" [control]="referenceId" [items]="references()" [key]="'reference'" [keyValue]="'id'" [showDefaultOption]="true" (onSelect)="sheetDetail.onReferenceSelect($event)"></app-ui-select>
        </app-ui-form-field>

        <div form-options class="grid grid-cols-2 gap-4 mb-4">
          <app-ui-form-field [controlName]="'collectionId'" [label]="'Colección'">
            <app-ui-select [className]="'w-full'" formControlName="collectionId" [id]="'collectionId'" [control]="collectionId" [items]="collections()" [key]="'name'" [keyValue]="'id'" [showDefaultOption]="true"></app-ui-select>
          </app-ui-form-field>

          <app-ui-form-field [controlName]="'statusId'" [label]="'Estado'">
            <app-ui-select [className]="'min-w-full'" formControlName="statusId" [id]="'statusId'" [control]="statusId" [items]="statuses()" [key]="'name'" [keyValue]="'id'" [showDefaultOption]="true"></app-ui-select>
          </app-ui-form-field>
        </div>

        @if(errorMessage()){
        <app-ui-error-message form-error>{{ errorMessage() }}</app-ui-error-message>
        }

      </app-sheet-detail>
    </fieldset>
  </form>
</app-modal-layout>
