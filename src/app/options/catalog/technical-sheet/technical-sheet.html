<app-work-space-layout>
  <div main-content class="h-full">
    <app-data-table
      [paginatedResponse]="paginatedResponse()"
      [columns]="columns"
      (onPagerChange)="pagerHandler($event)"
      (onSearch)="searchHandler($event)"
      [actions]="actions"
      (onAction)="actionHandler($event)"
      [tableToolsButtons]="tableToolsButtons">

      <ng-template appTableTemplate="createdAtTemplate" let-row>
        {{ row.created_at | date:'dd/MM/yyyy' }}
      </ng-template>

      <ng-template appTableTemplate="statusTemplate" let-row>
        <app-ui-badge
          [active]="!!(row.status_name?.toLowerCase().includes('elaboracion') || row.status_name?.toLowerCase().includes('elaboración'))"
          [activeText]="(row.status_name ?? '') | titlecase"
          [inactiveText]="(row.status_name ?? '—') | titlecase">
        </app-ui-badge>
      </ng-template>

    </app-data-table>
  </div>
</app-work-space-layout>

<app-side-modal-layout [hideCancel]="true" (onAccept)="closeModelForm()">
  <app-sheet-side-info [sheet]="sheet"></app-sheet-side-info>
</app-side-modal-layout>

<app-modal-layout [classNames]="'max-w-3xl'" [hideAccept]="true" (onCancel)="closeModelForm()">
  <form id="techForm" [formGroup]="modelForm" (ngSubmit)="submit()">  
    <fieldset [disabled]="showLoader()"> 
      <app-sheet-detail [measurements]="measurements()" [elasticCuts]="elasticCuts()"></app-sheet-detail>
    </fieldset>
  </form>
</app-modal-layout>
