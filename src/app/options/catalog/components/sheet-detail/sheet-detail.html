<app-ui-form-field [controlName]="'referenceId'" [label]="'Referencia'">
  <app-ui-select [className]="'w-full'" formControlName="referenceId" [id]="'referenceId'" [control]="reference" [items]="references()" [key]="'reference'" [keyValue]="'id'" [showDefaultOption]="true" (onSelect)="onReferenceSelect($event)"></app-ui-select>
</app-ui-form-field>

@if (referenceInfo(); as info) {
  <div class="grid grid-cols-2 gap-4">
    <app-ui-form-field [controlName]="''" [label]="'Descripción'">
      <input type="text" [value]="info.description || '—'" readonly
        class="w-full h-8 px-4 text-sm rounded border border-gray-300 bg-gray-50 outline-none" />
    </app-ui-form-field>

    <app-ui-form-field [controlName]="''" [label]="'Tallas'">
      <input type="text" [value]="info.sizes || '—'" readonly
        class="w-full h-8 px-4 text-sm rounded border border-gray-300 bg-gray-50 outline-none" />
    </app-ui-form-field>
  </div>
}

<div class="grid grid-cols-2 gap-4">
  <app-ui-form-field [controlName]="'collectionId'" [label]="'Colección'">
    <app-ui-select [className]="'w-full'" formControlName="collectionId" [id]="'collectionId'" [control]="collection" [items]="collections()" [key]="'name'" [keyValue]="'id'" [showDefaultOption]="true"></app-ui-select>
  </app-ui-form-field>

  <app-ui-form-field [controlName]="'statusId'" [label]="'Estado'">
    <app-ui-select [className]="'min-w-full'" formControlName="statusId" [id]="'statusId'" [control]="status" [items]="statuses()" [key]="'name'" [keyValue]="'id'" [showDefaultOption]="true"></app-ui-select>
  </app-ui-form-field>
</div>
