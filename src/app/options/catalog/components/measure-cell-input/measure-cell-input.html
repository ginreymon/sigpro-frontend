<input
  type="text"
  [attr.inputmode]="type === 'number' ? 'decimal' : null"
  [value]="value"
  [class]="`w-full px-2 rounded border outline-none transition-all duration-200 focus:ring-2 h-7 text-sm border-gray-300 focus:border-brand-500 focus:ring-brand-200 ${align === 'center' ? 'text-center' : ''}`"
  (input)="handleInput($event)" />
