<app-work-space-layout>
    <div main-content class="h-full">
        <app-data-table [paginatedResponse]="paginatedResponse()" [columns]="columns"
            (onPagerChange)="pagerHandler($event)" (onSearch)="searchHandler($event)" [actions]="actions"
            (onAction)="actionHandler($event)" [tableToolsButtons]="tableToolsButtons">

            <ng-template appTableTemplate="statusTemplate" let-row>
                <app-ui-badge [active]="row.is_active"></app-ui-badge>
            </ng-template>

        </app-data-table>
    </div>
</app-work-space-layout>

<app-side-modal-layout [hideCancel]="true" (onAccept)="closeModelForm()">

    <div class="mb-4 flex items-center gap-4">

        <app-char-square>
            {{ rowObject.name?.toUpperCase()?.charAt(0) }}
        </app-char-square>

        <div>
            <h3 class="text-2xl font-semibold text-slate-900 mb-2"> {{ rowObject.name | titlecase }} </h3>
            <p class="text-sm text-slate-500 mb-0.5"> Tipo: {{ rowObject.machine_type_name }} </p>
            <p class="text-sm text-slate-500 mb-0.5"> Estado activo: {{ rowObject.is_active ? 'Si' : 'No' }} </p>
        </div>

    </div>

    <app-metadata [rowObject]="rowObject"></app-metadata>

</app-side-modal-layout>

<app-modal-layout [formId]="'stampingMachineForm'" [mode]="actionType" [subtitle]="'Registra la máquina de estampación y su tipo.'" (onCancel)="closeModelForm()">

    <form id="stampingMachineForm" [formGroup]="modelForm" (ngSubmit)="submit()">
        <fieldset [disabled]="showLoader()" class="space-y-2">

            <app-ui-form-section [title]="'Datos de la máquina'" [cols]="2">
                <app-ui-form-field [controlName]="'name'" [label]="'Nombre'">
                    <app-ui-input formControlName="name" [id]="'name'" [placeholder]="'Nombre de la máquina'" [control]="name"></app-ui-input>
                </app-ui-form-field>

                <app-ui-form-field [controlName]="'machine_type'" [label]="'Tipo de máquina'">
                    <app-ui-select [className]="'w-full'" formControlName="machine_type" [id]="'machine_type'" [control]="machineType" [items]="machineTypes()" [key]="'name'" [keyValue]="'id'" [showDefaultOption]="true"></app-ui-select>
                </app-ui-form-field>

                @if(actionType == 'edit'){
                <app-ui-form-field [controlName]="'is_active'" [label]="'Máquina activa'" [layout]="'horizontal'">
                    <app-ui-checkbox formControlName="is_active" [control]="isActive" [id]="'is_active'"></app-ui-checkbox>
                </app-ui-form-field>
                }
            </app-ui-form-section>

            @if(errorMessage()){
            <app-ui-error-message>{{ errorMessage() }}</app-ui-error-message>
            }

        </fieldset>
    </form>

</app-modal-layout>
