<app-panel-layout [padded]="true">

  <div panel-header class="flex flex-col gap-3">

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 sm:gap-0">
      <h1 class="text-xl sm:text-3xl font-semibold text-gray-800 mb-3 mt-3">Estado de Estampación</h1>

      <app-efficiency-summary-bar
        [efficiency]="plantaModule().efficiency"
        [status]="plantaModule().status"
        [completed]="plantaModule().total_completed ?? 0"
        [activeModules]="plantaModuleCount()"
        [showFilterButton]="true"
        [filterActive]="showDateFilter()"
        (filterToggle)="toggleDateFilter()">
      </app-efficiency-summary-bar>
    </div>

  </div>

  <div panel-content>

    @if (showDateFilter()) {

      <app-range-results-panel
        [summaries]="rangeAllSummaries()"
        [unitOptions]="unitOptions()"
        unitLabel="Máquina"
        [defaultRange]="defaultRange()"
        [loading]="rangeLoading()"
        [searched]="rangeSearched()"
        [error]="rangeError()"
        (search)="onRangeSearch($event)"
        (retry)="retryRangeSearch()">
      </app-range-results-panel>

    } @else {

      <div class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr))">

        @if (modules().length === 0) {
          <app-stamping-efficiency-card
            [mod]="plantaModule()"
            [emptyLabel]="'SIN DATOS'"
            (cardClick)="openSheet($event)">
          </app-stamping-efficiency-card>
        } @else {
          @for (mod of allModules(); track mod.module_id) {
            <app-stamping-efficiency-card [mod]="mod" (cardClick)="openSheet($event)"></app-stamping-efficiency-card>
          }
        }

      </div>

    }
  </div>

</app-panel-layout>

<app-module-detail-modal
  [visible]="sheetVisible()"
  [module]="selectedModule()"
  [service]="service"
  (onClose)="closeSheet()">
</app-module-detail-modal>
