<app-work-space-layout>
<div main-content class="flex flex-col h-full">

  <div class="pb-4 border-b border-gray-200 flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-gray-800">Estado de troquelado</h1>
  </div>

  <div class="flex-1 min-h-0 overflow-y-auto mt-4">
    <div class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr))">

      <div class="bg-white border border-gray-200 rounded-xl p-5 flex flex-col justify-between min-h-45 hover:shadow-md transition-shadow cursor-pointer">
        <div class="flex justify-between items-start">
          <div>
            <span class="text-xs font-semibold tracking-widest text-gray-400 uppercase block mb-1">MÁQUINA 01</span>
            <h3 class="text-base font-semibold text-gray-800">TROQUELADORA</h3>
          </div>
          <app-ui-badge [intent]="'active'" [label]="'Activo'"></app-ui-badge>
        </div>

        <div class="mt-2 flex flex-col gap-3">
          <div>
            <span class="text-4xl font-semibold text-green-600">92.50%</span>
            <div class="mt-1 text-xs text-gray-500">
              <span>2 / 2 Encomendados</span>
            </div>
          </div>

          <div class="space-y-2">
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="text-gray-400">Completadas</span>
                <span class="font-medium text-green-600">480</span>
              </div>
              <app-progress-bar [progress]="480" [max]="520" [color]="'#16a34a'"></app-progress-bar>
            </div>
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="text-gray-400">Saldos</span>
                <span class="font-medium text-amber-500">30</span>
              </div>
              <app-progress-bar [progress]="30" [max]="520" [color]="'#f59e0b'"></app-progress-bar>
            </div>
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="text-gray-400">Bajas</span>
                <span class="font-medium text-red-500">10</span>
              </div>
              <app-progress-bar [progress]="10" [max]="520" [color]="'#ef4444'"></app-progress-bar>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-white border border-gray-200 rounded-xl p-5 flex flex-col justify-between min-h-45 hover:shadow-md transition-shadow cursor-pointer">
        <div class="flex justify-between items-start">
          <div>
            <span class="text-xs font-semibold tracking-widest text-gray-400 uppercase block mb-1">MÁQUINA 02</span>
            <h3 class="text-base font-semibold text-gray-800">PRENSA HIDRÁULICA</h3>
          </div>
          <app-ui-badge [intent]="'paused'" [label]="'Pausado'"></app-ui-badge>
        </div>

        <div class="mt-2 flex flex-col gap-3">
          <div>
            <span class="text-4xl font-semibold text-gray-400">0.00%</span>
            <div class="mt-1 text-xs text-gray-500">
              <span>0 / 1 Encomendados</span>
            </div>
          </div>

          <div class="space-y-2">
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="text-gray-400">Completadas</span>
                <span class="font-medium text-gray-400">0</span>
              </div>
              <app-progress-bar [progress]="0" [max]="300" [color]="'#9ca3af'"></app-progress-bar>
            </div>
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="text-gray-400">Saldos</span>
                <span class="font-medium text-gray-400">0</span>
              </div>
              <app-progress-bar [progress]="0" [max]="300" [color]="'#9ca3af'"></app-progress-bar>
            </div>
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="text-gray-400">Bajas</span>
                <span class="font-medium text-gray-400">0</span>
              </div>
              <app-progress-bar [progress]="0" [max]="300" [color]="'#9ca3af'"></app-progress-bar>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-white border border-gray-200 rounded-xl p-5 flex flex-col justify-between min-h-45 hover:shadow-md transition-shadow cursor-pointer">
        <div class="flex justify-between items-start">
          <div>
            <span class="text-xs font-semibold tracking-widest text-gray-400 uppercase block mb-1">MÁQUINA 03</span>
            <h3 class="text-base font-semibold text-gray-800">CIZALLA</h3>
          </div>
          <app-ui-badge [intent]="'inactive'" [label]="'Inactivo'"></app-ui-badge>
        </div>

        <div class="mt-2 flex flex-col gap-3">
          <div>
            <span class="text-4xl font-semibold text-gray-400">0.00%</span>
            <div class="mt-1 text-xs text-gray-500">
              <span>0 / 0 Encomendados</span>
            </div>
          </div>

          <div class="space-y-2">
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="text-gray-400">Completadas</span>
                <span class="font-medium text-gray-400">0</span>
              </div>
              <app-progress-bar [progress]="0" [max]="100" [color]="'#9ca3af'"></app-progress-bar>
            </div>
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="text-gray-400">Saldos</span>
                <span class="font-medium text-gray-400">0</span>
              </div>
              <app-progress-bar [progress]="0" [max]="100" [color]="'#9ca3af'"></app-progress-bar>
            </div>
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="text-gray-400">Bajas</span>
                <span class="font-medium text-gray-400">0</span>
              </div>
              <app-progress-bar [progress]="0" [max]="100" [color]="'#9ca3af'"></app-progress-bar>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>
</app-work-space-layout>
