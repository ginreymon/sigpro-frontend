<div [formGroup]="form">
    <app-ui-form-field [controlName]="'stamp_type_description'" [label]="'Descripción tipo estampado'">
        <app-ui-select [className]="'w-full'" formControlName="stamp_type_description" [id]="'stamp_type_description'" [control]="stampTypeDescription" [items]="stampTypeDescriptions" [key]="'name'" [keyValue]="'id'" [showDefaultOption]="true"></app-ui-select>
    </app-ui-form-field>

    <app-ui-form-field [controlName]="'technique'" [label]="'Técnica'">
        <app-ui-select [className]="'w-full'" formControlName="technique" [id]="'technique'" [control]="technique" [items]="techniques" [key]="'name'" [keyValue]="'id'" [showDefaultOption]="true"></app-ui-select>
    </app-ui-form-field>

    <app-ui-form-field [controlName]="'frames'" [label]="'Marcos'">
        <app-ui-input [type]="'number'" formControlName="frames" [id]="'frames'" [placeholder]="'Marcos'" [control]="frames"></app-ui-input>
    </app-ui-form-field>

    <app-ui-form-field [controlName]="'inks'" [label]="'Tintas'">
        <app-ui-input [type]="'number'" formControlName="inks" [id]="'inks'" [placeholder]="'Tintas'" [control]="inks"></app-ui-input>
    </app-ui-form-field>

    <app-ui-form-field [controlName]="'prints'" [label]="'Impresiones'">
        <app-ui-input [type]="'number'" formControlName="prints" [id]="'prints'" [placeholder]="'Impresiones'" [control]="prints"></app-ui-input>
    </app-ui-form-field>

    <app-ui-form-field [controlName]="'layout_form'" [label]="'Forma de trazo'">
        <app-ui-select [className]="'w-full'" formControlName="layout_form" [id]="'layout_form'" [control]="layoutForm" [items]="layoutForms" [key]="'name'" [keyValue]="'id'" [showDefaultOption]="true"></app-ui-select>
    </app-ui-form-field>

    <app-ui-form-field [controlName]="'pre_dried'" [label]="'Presecado'">
        <app-ui-input [type]="'number'" formControlName="pre_dried" [id]="'pre_dried'" [placeholder]="'Presecado'" [control]="preDried"></app-ui-input>
    </app-ui-form-field>
</div>
