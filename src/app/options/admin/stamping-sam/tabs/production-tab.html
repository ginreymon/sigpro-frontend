<div [formGroup]="form">
    <app-ui-form-field [controlName]="'location'" [label]="'Ubicación'">
        <app-ui-select [className]="'w-full'" formControlName="location" [id]="'location'" [control]="location" [items]="locations" [key]="'name'" [keyValue]="'id'" [showDefaultOption]="true"></app-ui-select>
    </app-ui-form-field>

    <app-ui-form-field [controlName]="'machine_type'" [label]="'Tipo de Máquina'">
        <app-ui-select [className]="'w-full'" formControlName="machine_type" [id]="'machine_type'" [control]="machineType" [items]="machineTypes" [key]="'name'" [keyValue]="'id'" [showDefaultOption]="true"></app-ui-select>
    </app-ui-form-field>

    <app-ui-form-field [controlName]="'piece'" [label]="'Pieza(s)'">
        <app-ui-select [className]="'w-full'" formControlName="piece" [id]="'piece'" [control]="piece" [items]="pieces" [key]="'name'" [keyValue]="'id'" [showDefaultOption]="true"></app-ui-select>
    </app-ui-form-field>

    <app-ui-form-field [controlName]="'task_people_count'" [label]="'Personas por tarea'">
        <app-ui-input [type]="'number'" formControlName="task_people_count" [id]="'task_people_count'" [placeholder]="'Número personas'" [control]="taskPeopleCount"></app-ui-input>
    </app-ui-form-field>

    <app-ui-form-field [controlName]="'stamped_pieces'" [label]="'Piezas que se estampan'">
        <app-ui-input [type]="'number'" formControlName="stamped_pieces" [id]="'stamped_pieces'" [placeholder]="'Piezas que se estampan'" [control]="stampedPieces"></app-ui-input>
    </app-ui-form-field>

    <app-ui-form-field [controlName]="'pieces_per_board'" [label]="'Piezas por tablero'">
        <app-ui-input [type]="'number'" formControlName="pieces_per_board" [id]="'pieces_per_board'" [placeholder]="'Piezas por tablero'" [control]="piecesPerBoard"></app-ui-input>
    </app-ui-form-field>

    <app-ui-form-field [controlName]="'fabric_type'" [label]="'Tipo de tela'">
        <app-ui-select [className]="'w-full'" formControlName="fabric_type" [id]="'fabric_type'" [control]="fabricType" [items]="fabricTypes" [key]="'name'" [keyValue]="'id'" [showDefaultOption]="true"></app-ui-select>
    </app-ui-form-field>
</div>
