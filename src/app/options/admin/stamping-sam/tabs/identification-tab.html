<div [formGroup]="form">
    <app-ui-form-field [controlName]="'no_reference'" [label]="`${!noReference?.value?'No asociar':'Asociar'} referencia Siesa`" [layout]="'horizontal'">
        <app-ui-checkbox formControlName="no_reference" [control]="noReference" [id]="'no_reference'"></app-ui-checkbox>
    </app-ui-form-field>

    @if (noReference?.value) {
    <app-ui-form-field [controlName]="'rowid_item'" [label]="'Referencia (Siesa)'">
        <app-ui-combobox [className]="'w-full'" formControlName="rowid_item" [id]="'rowid_item'" [control]="rowidItem" [items]="references" [key]="'reference'" [keyValue]="'rowid_item'" [placeholder]="'Buscar referencia...'" (onSelect)="referenceSelect.emit($event)"></app-ui-combobox>
    </app-ui-form-field>
    }
    <app-ui-form-field [controlName]="'reference_code'" [label]="'Código (Estampación)'">
        <app-ui-input formControlName="reference_code" [id]="'reference_code'" [placeholder]="'Código'" [control]="referenceCode"></app-ui-input>
    </app-ui-form-field>
</div>
