<div [formGroup]="form">
    <app-ui-form-field [controlName]="'sam'" [label]="'SAM por persona'">
        <app-ui-input [type]="'number'" [isFloat]="true" formControlName="sam" [id]="'sam'" [placeholder]="'Ej: 4.1260'" [control]="sam"></app-ui-input>
    </app-ui-form-field>

    <div class="mb-2">
        <label class="block text-sm font-medium text-slate-700 mb-1">Tareas por hora</label>
        <p class="text-sm text-slate-600">{{ calcTasksPerHour(sam?.value, taskPeopleCount?.value) ?? '—' }}</p>
    </div>

    @if(actionType == 'edit'){
    <app-ui-form-field [controlName]="'is_active'" [label]="'Registro activo'" [layout]="'horizontal'">
        <app-ui-checkbox formControlName="is_active" [control]="isActive" [id]="'is_active'"></app-ui-checkbox>
    </app-ui-form-field>
    }
</div>
