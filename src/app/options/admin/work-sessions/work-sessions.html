<app-work-space-layout>
    <div main-content class="h-full flex flex-col overflow-hidden">

        <!-- The alert takes its own row at the top: the table below shrinks instead of overflowing. -->
        <app-ui-alert class="shrink-0 mb-2" [intent]="'error'" [message]="errorMessage()"
            (onClose)="errorMessage.set('')" role="alert"></app-ui-alert>

        <div class="flex-1 min-h-0">
        <app-data-table [paginatedResponse]="sessions()" [columns]="columns"
            [searchPlaceholder]="'Buscar por OP, número de OP, referencia o módulo'"
            [actions]="actions" (onSearch)="search($event)"
            (onPagerChange)="pagerHandler($event)" (onAction)="actionHandler($event)" [columnFilter]="true">

            <!-- started_at arrives in UTC (the service appends the Z): DatePipe shows it in local time. -->
            <ng-template appTableTemplate="startedAtTemplate" let-row>
                {{ row.started_at | date: 'dd/MM/yyyy HH:mm' }}
            </ng-template>
            <!-- breaks_count is "N · X min": count in bold, minutes muted (the column filter still lists the text). -->
            <ng-template appTableTemplate="breaksTemplate" let-row>
                @if (row.breaks_count?.split(' · '); as p) {
                <span class="font-medium text-slate-900">({{ p[0] }})</span>                   
                <span class="ml-1.5 text-red-600">{{ p[1] }}</span>
                }
            </ng-template>
            <!-- Same area colour as manual-integration: the origin badge is keyed by the area id. -->
            <ng-template appTableTemplate="areaTemplate" let-row>
                <app-ui-origin-badge [originId]="row.area_id" [label]="row.area_name ?? ''"></app-ui-origin-badge>
            </ng-template>
            <ng-template appTableTemplate="statusTemplate" let-row>
                <app-ui-badge [intent]="row.is_closed ? 'inactive' : 'active'"
                    [label]="row.is_closed ? 'Cerrada' : 'Abierta'"></app-ui-badge>
            </ng-template>
        </app-data-table>
        </div>

        @if (sessions() && sessions()!.results.length === 0) {
        <p class="text-sm text-slate-500 mt-3">No hay sesiones para los filtros seleccionados.</p>
        }

    </div>
</app-work-space-layout>

<app-side-modal-layout [hideCancel]="true" [acceptLabel]="'Cerrar'" (onAccept)="closeDetail()" (onCancel)="closeDetail()">
    @if (selected(); as session) {
    <app-session-detail [session]="session" (editRecord)="openRecordForm($event)"></app-session-detail>
    }
</app-side-modal-layout>

<!-- Edit form of the record picked in the side modal; its content depends on the record kind. -->
<app-modal-layout [formId]="'recordForm'" [classNames]="'max-w-2xl'" (onCancel)="closeRecordForm()">
    @if (record(); as rec) {
    <app-record-form [kind]="rec.kind" [data]="rec.data" (saved)="closeRecordForm()"></app-record-form>
    }
</app-modal-layout>
