<!-- Flat, read-only layout: scalars as small-label/value pairs, each nested object/array as a titled
     section with a card (no nested accordions). -->
<div class="space-y-4">
    @if (scalars.length) {
    <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-3">
        @for (line of scalars; track line.label) {
        <div class="min-w-0">
            <dt class="text-xs text-slate-500">{{ line.label }}</dt>
            <dd class="text-sm text-slate-900 break-words">{{ line.value }}</dd>
        </div>
        }
    </dl>
    }
    @for (c of children; track $index) {
    <section>
        <h5 class="mb-1.5 text-xs font-semibold uppercase tracking-wide text-slate-500">{{ c.title }}</h5>
        @if (c.key === 'employees') {
        <div class="flex flex-wrap gap-1.5">
            @for (name of employeeNames(c.value); track $index) {
            <span class="rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-medium text-slate-700">{{ name }}</span>
            }
        </div>
        } @else {
        <div class="rounded-lg border border-slate-200 bg-white p-3">
            <app-detail-block [data]="c.value"></app-detail-block>
        </div>
        }
    </section>
    }
</div>
