@switch (kind) {
@case ('production') { <app-production-record-form [data]="data" [session]="session" (saved)="saved.emit()"></app-production-record-form> }
@case ('stamping') { <app-stamping-record-form [data]="data" [session]="session" (saved)="saved.emit()"></app-stamping-record-form> }
@case ('break') { <app-break-record-form [data]="data" [session]="session" (saved)="saved.emit()"></app-break-record-form> }
@case ('downtime') { <app-downtime-record-form [data]="data" [session]="session" (saved)="saved.emit()"></app-downtime-record-form> }
}
