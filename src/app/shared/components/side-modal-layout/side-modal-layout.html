<div [class]="'fixed inset-0 z-50 flex transform ' + (initialized() ? 'transition-transform duration-300 ' : '') + (openModal() ? 'translate-x-0' : 'translate-x-full')">
  
  <div [class]="'fixed inset-0 bg-black/40 '+(openModal() ? 'transition-opacity opacity-100 delay-300' : 'opacity-0')" (click)="close()"></div>

    <div class="relative ml-auto w-full max-w-xl h-full bg-white shadow-xl rounded-l-xl">

    <div class="flex flex-col h-full px-3 sm:px-6 py-6">

      <div class="flex items-center justify-between border-b border-gray-200 pb-4">
        <h3 class="text-lg font-semibold text-gray-900">
          {{ title | titlecase }}
        </h3>

        <app-ui-close-button (onClose)="close()"></app-ui-close-button>
      </div>

      <div class="flex-1 py-6 overflow-y-auto text-gray-600">
        <ng-content></ng-content>
      </div>

      <div class="border-t border-gray-200 pt-4 flex justify-end gap-3">
      
        @if(!hideCancel){
        <app-ui-button intent="cancel" (onClick)="close()">
          {{ cancelLabel ?? 'Cancelar'}}
        </app-ui-button>
        }
      
        @if(!hideAccept){
        <app-ui-button (onClick)="accept()">
          {{ acceptLabel ?? 'Aceptar'}}
        </app-ui-button>
        }
      
      </div>

    </div>

  </div>
</div>
