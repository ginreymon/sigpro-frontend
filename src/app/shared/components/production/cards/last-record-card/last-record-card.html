@if (lastRecordLoading()) {
  <app-ui-option-card class="mt-3 w-fit" [disabled]="true">
    <div class="flex items-center gap-3 pr-4">
      <div class="flex items-center justify-center h-8 w-8 rounded-md bg-gray-100 shrink-0">
        <div class="h-4 w-4 border-2 border-gray-300 border-t-brand-500 rounded-full animate-spin"></div>
      </div>
      <div class="shrink-0">
        <p class="text-xs text-gray-400">Última OP</p>
        <p class="text-sm text-gray-400">Cargando...</p>
      </div>
    </div>
  </app-ui-option-card>
} @else if (lastRecord()) {
  <app-ui-option-card class="mt-3 w-fit" (onToggle)="navigate()">
    <div class="flex items-center gap-3">
      <div class="flex items-center justify-center h-8 w-8 rounded-md bg-gray-100 shrink-0">
        <app-ui-icon [iconName]="'clockRotateLeft'" class="h-4 w-4 text-brand-500"></app-ui-icon>
      </div>
      <div class="shrink-0">
        <p class="text-xs text-gray-400">Última OP</p>
        <p class="text-sm font-semibold text-gray-700">{{ lastRecord()!.op_type }} {{ lastRecord()!.op_number }}</p>
      </div>
      <app-ui-icon [iconName]="'chevronRight'" class="h-4 w-4 text-gray-400 shrink-0"></app-ui-icon>
    </div>
  </app-ui-option-card>
} @else {
  <app-ui-option-card class="mt-3 w-fit" [disabled]="true">
    <div class="flex items-center gap-3">
      <div class="flex items-center justify-center h-8 w-8 rounded-md bg-gray-100 shrink-0">
        <app-ui-icon [iconName]="'clockRotateLeft'" class="h-4 w-4 text-gray-400"></app-ui-icon>
      </div>
      <div class="shrink-0">
        <p class="text-xs text-gray-400">Última OP</p>
        <p class="text-sm text-gray-400">No hay OPs registradas</p>
      </div>
    </div>
  </app-ui-option-card>
}
