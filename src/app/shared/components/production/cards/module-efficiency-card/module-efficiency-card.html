<app-efficiency-card-frame
  [mod]="mod"
  unitLabel="MÓDULO"
  [displayName]="mod.name"
  [emptyLabel]="emptyLabel"
  (cardClick)="cardClick.emit($event)">

@if (!showQuantityBars) {
  <app-hourly-target-block
    [units]="mod.total_produced ?? 0"
    [unitTarget]="mod.unit_target ?? 0"
    [installedMinutes]="mod.minutos_instalados ?? 0"
    [employees]="mod.employees_snapshot ?? 0"
    [operators]="mod.operator_count ?? 0"
    [muted]="mod.status !== 'ACTIVE'">
  </app-hourly-target-block>
} @else {
  <div>
    <div class="flex justify-between text-xs mb-1">
      <span class="text-gray-400">Completadas</span>
      <span [class]="statValueClass('completed')">{{ mod.total_completed ?? 0 }}</span>
    </div>
    <app-progress-bar
      [progress]="mod.total_completed ?? 0"
      [max]="mod.unit_target ?? 0"
      [color]="barColor('completed')">
    </app-progress-bar>
  </div>

  <div>
    <div class="flex justify-between text-xs mb-1">
      <span class="text-gray-400">Saldos</span>
      <span [class]="statValueClass('rejected')">{{ mod.total_rejected ?? 0 }}</span>
    </div>
    <app-progress-bar
      [progress]="mod.total_rejected ?? 0"
      [max]="mod.unit_target ?? 0"
      [color]="barColor('rejected')">
    </app-progress-bar>
  </div>

  <div>
    <div class="flex justify-between text-xs mb-1">
      <span class="text-gray-400">Bajas</span>
      <span [class]="statValueClass('scrap')">{{ mod.total_scrap ?? 0 }}</span>
    </div>
    <app-progress-bar
      [progress]="mod.total_scrap ?? 0"
      [max]="mod.unit_target ?? 0"
      [color]="barColor('scrap')">
    </app-progress-bar>
  </div>
}

</app-efficiency-card-frame>
