<app-efficiency-card-frame
  [mod]="mod"
  unitLabel="MÁQUINA"
  [displayName]="mod.machine_name ?? mod.name"
  [emptyLabel]="emptyLabel"
  (cardClick)="cardClick.emit($event)">

@if (!showQuantityBars) {
  <app-hourly-target-block
    [units]="mod.total_completed ?? 0"
    [producedMinutes]="mod.minutos_producidos ?? 0"
    [employees]="mod.employees_snapshot ?? 0"
    [operators]="mod.operator_count ?? 0"
    [muted]="mod.status !== 'ACTIVE'">
  </app-hourly-target-block>
} @else {
  <div>
    <div class="flex justify-between text-xs mb-1">
      <span class="text-gray-400">Completadas</span>
      <span [class]="statValueClass()">{{ mod.total_completed ?? 0 }}</span>
    </div>
    <app-progress-bar
      [progress]="mod.total_completed ?? 0"
      [max]="mod.unit_target ?? 0"
      [color]="barColor()">
    </app-progress-bar>
  </div>
  <div>
    @if (mod.last_worked_date) {
      <div class="flex justify-between text-xs mb-1">
        <span class="text-gray-400">Última jornada ({{ formatLastWorkedDate() }})</span>
        <span class="font-medium text-gray-600">{{ mod.last_worked_efficiency?.toFixed(0) }}%</span>
      </div>
      <app-progress-bar
        [progress]="mod.last_worked_efficiency ?? 0"
        [max]="100"
        [color]="'#94a3b8'">
      </app-progress-bar>
    } @else {
      <div class="flex justify-between text-xs mb-1">
        <span class="text-gray-400">Última jornada</span>
        <span class="font-medium text-gray-400">Sin datos</span>
      </div>
      <app-progress-bar [progress]="0" [max]="0" [color]="'#e5e7eb'"></app-progress-bar>
    }
  </div>
}

</app-efficiency-card-frame>
