<div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:min-h-72">

    <!-- Action card skeleton -->
    <div class="bg-brand-400 rounded-lg p-6 flex flex-col justify-between min-h-50">
        <div class="space-y-3">
            <div class="h-3 skeleton-light rounded w-1/4"></div>
            <div class="h-6 skeleton-light rounded w-1/2"></div>
            <div class="h-3 skeleton-light rounded w-3/4"></div>
        </div>
        <div class="flex flex-wrap gap-3 mt-6">
            <div class="h-8 skeleton-light rounded-lg w-28"></div>
            <div class="h-8 skeleton-light rounded-lg w-40"></div>
        </div>
    </div>

    <!-- Shift card skeleton -->
    <div class="bg-white border border-gray-200 rounded-lg p-6 flex flex-col gap-4">
        <div class="flex items-center gap-3 pb-4 border-b border-gray-200">
            <div class="w-10 h-10 skeleton rounded-md shrink-0"></div>
            <div class="flex-1 space-y-2">
                <div class="h-3 skeleton rounded w-1/3"></div>
                <div class="h-4 skeleton rounded w-2/3"></div>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-x-6 gap-y-2">
            @for (i of statSlots(); track i) {
            <div class="bg-gray-100 p-2 rounded-md h-16">
                <div class="h-3 skeleton rounded w-2/3 mb-1"></div>
                <div class="h-8 skeleton rounded w-1/2"></div>
            </div>
            }
        </div>
    </div>

</div>
