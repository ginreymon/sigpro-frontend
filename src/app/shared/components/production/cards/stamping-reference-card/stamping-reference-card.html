<app-ui-option-card [obj]="item" [selected]="selected" (onToggle)="onToggle.emit()">
  <div class="flex items-start justify-between gap-2 text-gray-500">
    <div class="min-w-0">
      <div class="flex flex-row justify-start gap-2 items-center mb-1">
        <app-ui-icon [iconName]="'tag'" class="h-4 w-4"></app-ui-icon>
        <p class="font-medium text-sm">
          <strong>{{ item.identification }}</strong>
        </p>
      </div>
      @if (item.machine_type_name) {
        <p class="text-xs"><strong>Tipo de Máquina</strong> {{ item.machine_type_name }}</p>
      }
    </div>
    <div class="flex flex-col items-end gap-1 shrink-0">
      <span class="text-xs font-semibold text-green-600 whitespace-nowrap">SAM {{ item.sam }}</span>
    </div>
  </div>
  <div class="flex justify-between items-center mt-1">
    <span class="text-xs text-gray-500 whitespace-nowrap"> <strong>Tarea/hora</strong> {{ item.tasks_per_hour }}</span>
  </div>
</app-ui-option-card>
