<app-ui-option-card
  [obj]="item"
  [selected]="selected"
  (onToggle)="onToggle.emit()">
  <div class="flex flex-row justify-start gap-2 items-center mb-1">
    <app-ui-icon [iconName]="'tag'" class="h-4 w-4"></app-ui-icon>
    <p class="font-medium text-sm">{{ item.identification }}</p>
  </div>
  @if (item.machine_name) {
    <p class="text-xs text-gray-500 flex items-center gap-1">
      <app-ui-icon [iconName]="'screwdriverWrench'" class="h-3 w-3"></app-ui-icon>
      <strong>Máquina</strong> {{ item.machine_name }}
    </p>
  }
  <div class="flex justify-between items-center mt-1">
    <span class="text-xs font-semibold text-green-600 whitespace-nowrap">SAM {{ item.sam_single_person }}</span>
    <span class="text-xs text-gray-500 whitespace-nowrap">{{ item.tasks_per_hour }} tareas/h</span>
  </div>
</app-ui-option-card>
