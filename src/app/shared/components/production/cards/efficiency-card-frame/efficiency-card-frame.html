<div
  class="bg-white border border-gray-200 rounded-xl p-5 flex flex-col justify-between hover:shadow-md transition-shadow cursor-pointer"
  (click)="onClick()">

  <div class="flex justify-between items-start">
    <div class="min-w-0">
      @if (mod.module_id === 0) {
        <span class="text-xs font-semibold tracking-widest text-brand-400 uppercase block mb-1">
          RESUMEN GENERAL
        </span>
        <h3 [class]="'text-base font-semibold ' + titleClass('text-brand-700')">{{ emptyLabel ?? displayName }}</h3>
      } @else {
        <span class="text-xs font-semibold tracking-widest text-gray-400 uppercase block mb-1">
          {{ unitLabel }} {{ padNumber(mod.number) }}
        </span>
        <h3 [class]="'text-base font-semibold truncate ' + titleClass('text-gray-800')">{{ displayName | uppercase }}</h3>
      }
    </div>
    <app-ui-badge [intent]="badgeIntent()" [label]="statusLabel()"></app-ui-badge>
  </div>

  <div class="mt-2 flex flex-col gap-3">
    <div>
      <span [class]="efficiencyClass()">{{ mod.efficiency.toFixed(2) }}%</span>
      <div class="mt-1 text-xs text-gray-500">
        <span>{{ mod.employees_snapshot ?? 0 }} / {{ mod.operator_count }} Encomendados</span>
      </div>
    </div>

    <div class="space-y-2">
      <ng-content></ng-content>
    </div>
  </div>

</div>
