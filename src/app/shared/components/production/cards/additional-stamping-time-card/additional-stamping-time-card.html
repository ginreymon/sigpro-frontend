<app-ui-option-card [obj]="item" [selected]="selected" (onToggle)="onToggle.emit()">
  <div class="flex items-start justify-between gap-2 text-gray-500">
    <div class="min-w-0">
      <div class="flex flex-row justify-start gap-2 items-center mb-1">
        <app-ui-icon [iconName]="'hourglassStart'" class="h-4 w-4"></app-ui-icon>
        <p class="font-medium text-sm">     
          <strong class="text-xs "> {{ item?.process ?? '' | titlecase }}</strong>
        </p>
      </div>
      <p class="text-xs"><strong>Código</strong> {{ item?.engineering_code }}</p>
      @if (item?.machine_name) {
        <p class="text-xs"><strong>Máquina</strong> {{ item.machine_name }}</p>
      }
    </div>
    <div class="flex flex-col items-end gap-1 shrink-0">
      <span class="text-xs font-semibold text-green-600 whitespace-nowrap">SAM {{ item?.standard_time }}</span>
      <ng-content select="[quantity-input]"></ng-content>
    </div>
  </div>
</app-ui-option-card>
