<app-ui-option-card [obj]="item" [selected]="selected" (onToggle)="onToggle.emit()">
  <div class="flex items-start justify-between gap-2 text-gray-500">
    <div class="min-w-0">
      <div class="flex flex-row justify-start gap-2 items-center mb-1">
        <app-ui-icon [iconName]="'hammer'" class="h-4 w-4"></app-ui-icon>
        <p class="font-semibold text-sm"> {{ item?.process ?? '' | titlecase }} </p>
      </div>
      <p class="text-xs"><strong>Código</strong> {{ item?.engineering_code }}</p>
      @if (item?.machine_name ?? item?.machine_type_name; as machineLabel) {
        <p class="text-xs"><strong>Máquina</strong> {{ machineLabel }}</p>
      }
    </div>
    @if(item?.standard_time){
    <span class="text-xs font-semibold text-green-600 whitespace-nowrap shrink-0"> {{ item?.standard_time }} min </span>
    }
  </div>

  @if (selected) {
    <div class="flex justify-end mt-2 pt-2 border-t border-brand-200">
      <ng-content select="[quantity-input]"></ng-content>
    </div>
  }
</app-ui-option-card>
