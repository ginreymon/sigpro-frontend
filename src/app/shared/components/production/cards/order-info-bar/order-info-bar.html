@if (cards().length) {
<div class="w-full flex flex-row justify-between py-3 border-y border-slate-200">
  @for (card of cards(); track $index; let last = $last) {
  <app-ui-tooltip [message]="card.tooltip ?? ''">
    <div
      [class]="'flex flex-col rounded px-2 py-1 transition-colors ' + (last ? 'items-end text-right ' : '') + (card.action ? 'group cursor-pointer hover:bg-brand-50' : '')"
      (click)="card.action?.()">
      <h3 [class]="'flex items-center gap-0.5 text-xs ' + (card.action ? 'text-brand-600' : 'text-slate-500') + (last ? ' flex-row-reverse' : '')">
        {{ card.title }}
        @if (card.action) {
        <app-ui-icon [iconName]="'chevronRight'" class="w-3 h-3"></app-ui-icon>
        }
      </h3>
      <p [class]="getDataClass(card)">{{ card.display | uppercase }}</p>
    </div>
  </app-ui-tooltip>
  }
</div>
}
