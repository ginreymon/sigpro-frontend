<div class="grid grid-cols-1 gap-2">
  <div [class]="'rounded-lg px-3 py-2 ' + (muted ? 'bg-gray-50' : 'bg-brand-50')">
    <div class="flex items-center justify-between gap-2">
      <span class="text-xs font-semibold tracking-widest text-brand-400 uppercase">Meta por hora</span>
      <span class="text-xs text-gray-500">Para {{ activeEmployees }} {{ activeEmployees === 1 ? 'operario' : 'operarios' }}</span>
    </div>
    <div class="flex items-baseline gap-1">
      <span [class]="'text-3xl font-semibold ' + (muted ? 'text-gray-400' : 'text-brand-700')">{{ hourlyTarget }}</span>
      <span class="text-xs text-gray-500">unidades/hora</span>
    </div>
  </div>
  <div class="flex items-baseline justify-between gap-2 rounded-lg border border-gray-100 px-3 py-2">
    <span class="text-xs font-semibold tracking-widest text-gray-400 uppercase">Total de unidades</span>
    <span [class]="'text-xl font-semibold ' + (muted ? 'text-gray-400' : 'text-gray-800')">{{ units }}</span>
  </div>
</div>
