<app-ui-option-card
  (onToggle)="onToggle.emit()"
  [selected]="selected">
  <div class="relative flex flex-col gap-2" role="button" [attr.aria-pressed]="selected">
    @if (selected) {
      <app-ui-icon [iconName]="'circleCheck'" class="absolute -top-1 -right-1 h-4 w-4 text-brand-500"></app-ui-icon>
    }

    <!-- Header: icon tile + name -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg border flex items-center justify-center shrink-0 transition-colors duration-200"
        [class]="selected ? 'bg-brand-500 border-brand-500 text-white' : 'bg-brand-50 border-brand-100 text-brand-500'">
        <app-ui-icon [iconName]="'alarmClock'" class="h-5 w-5"></app-ui-icon>
      </div>
      <div class="flex-1 min-w-0">
        <h3 class="text-xs leading-4 text-slate-500">Turno</h3>
        <p class="text-sm leading-5 font-semibold truncate" [class]="selected ? 'text-brand-600' : 'text-gray-700'">
          {{ shift.name | titlecase | ellipsis:20 }}
        </p>
      </div>
    </div>

    <!-- Details -->
    <div class="flex flex-col gap-1 pt-2 border-t" [class]="selected ? 'border-brand-200' : 'border-slate-200'">
      <div class="flex items-baseline justify-between gap-2">
        <span class="text-xs leading-4 text-slate-500">Horario</span>
        <span class="text-xs leading-4 font-semibold text-gray-700 tabular-nums">{{ shift.start_time }} – {{ shift.end_time }}</span>
      </div>
      <div class="flex items-baseline justify-between gap-2">
        <span class="text-xs leading-4 text-slate-500">Ubicación</span>
        <span class="text-xs leading-4 font-semibold text-gray-700 truncate">{{ shift.location?.name ?? '' | titlecase | ellipsis:25 }}</span>
      </div>
    </div>
  </div>
</app-ui-option-card>
