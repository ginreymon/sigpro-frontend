<div class="absolute right-0 top-full z-30 mt-1 w-60 max-w-[80vw] max-h-64 overflow-y-auto rounded-md bg-white shadow-lg transition-all duration-150">
  <h4 class="sticky top-0 bg-gray-100 border-b border-gray-200 px-3 text-xs font-semibold uppercase tracking-wide text-gray-500 py-3">
    Empleados en el módulo
  </h4>

  @if (employees.length) {
    <ul class="p-1 text-xs font-medium text-gray-700">
      @for (e of employees; track e.id) {
        <li class="rounded-md transition-all duration-200">
          <div class="flex items-center gap-2 w-full p-2 rounded-lg">
            <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[10px] font-semibold"
            [class]="badgeClass(e)">
              {{ initials(e) | uppercase }}
            </span>
            <span class="truncate flex-1">
              <span class="font-semibold" [class]="weightClass(e)">({{ weight(e) }})</span>
              {{ displayName(e) }}
            </span>
          </div>
        </li>
      }
    </ul>
  } @else {
    <div class="px-3 py-2 text-sm font-medium text-gray-400">Sin empleados asignados</div>
  }
</div>
