<div class="absolute right-0 top-full z-30 mt-1 w-60 max-w-[80vw] max-h-64 overflow-y-auto rounded-md border border-gray-200 bg-white shadow-lg">
  <h4 class="sticky top-0 bg-gray-50 border-b border-gray-200 px-3 py-1.5 text-[11px] font-semibold uppercase tracking-wide text-gray-500">
    Empleados en el módulo
  </h4>

  @if (employees.length) {
    <div class="divide-y divide-gray-100">
      @for (e of employees; track e.id) {
        <div class="flex items-center gap-2 px-3 py-2 text-xs text-gray-700 hover:bg-gray-50">
          <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-gray-100 text-[10px] font-semibold text-gray-500">
            {{ initials(e) | uppercase }}
          </span>
          <span class="truncate flex-1">{{ displayName(e) }}</span>
          @if (e.is_apprentice) {
            <span class="shrink-0 rounded bg-amber-50 px-1.5 py-0.5 text-[10px] font-semibold text-amber-600">Aprendiz</span>
          }
        </div>
      }
    </div>
  } @else {
    <div class="px-3 py-2 text-xs text-gray-400">Sin empleados asignados</div>
  }
</div>
