<div
  class="group bg-white border border-gray-200 rounded-lg p-3 flex flex-col gap-2 shadow-sm transition-colors duration-200"
  [class.hover:border-brand-400]="clickable"
  [class.hover:shadow-md]="clickable"
  [class.cursor-pointer]="clickable"
  [class.focus-visible:ring-2]="clickable"
  [class.ring-brand-200]="clickable"
  [class.outline-none]="clickable"
  [attr.role]="clickable ? 'button' : null"
  [attr.tabindex]="clickable ? 0 : null"
  (click)="onClick()"
  (keydown.enter)="onClick()"
  (keydown.space)="$event.preventDefault(); onClick()">
  <div class="flex items-center justify-between gap-2">
    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">{{ label }}</span>
    <span class="flex items-center gap-2">
      <app-ui-badge [intent]="badgeIntent()" [label]="badgeLabel()"></app-ui-badge>
      @if (clickable) {
        <span class="flex items-center gap-0.5 text-xs text-slate-500 group-hover:text-brand-600 transition-colors duration-200">
          Ver panel
          <app-ui-icon [iconName]="'chevronRight'" class="w-3 h-3"></app-ui-icon>
        </span>
      }
    </span>
  </div>
  <app-efficiency-summary-bar
    [efficiency]="shownEfficiency"
    [status]="status"
    [completed]="shownCompleted"
    [activeModules]="activeModules">
  </app-efficiency-summary-bar>
</div>
