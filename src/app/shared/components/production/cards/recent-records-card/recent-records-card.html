<div class="flex flex-row gap-2">
  @for (view of slotViews(); track $index) {
    @if (view) {
      <app-ui-option-card class="w-40 h-14" [disabled]="view.disabled" (onToggle)="view.record && navigate(view.record)">
        <div class="flex items-center gap-2 h-full">
          <div class="flex items-center justify-center h-8 w-8 rounded-md bg-gray-100 shrink-0">
            @if (view.spinner) {
              <div class="h-4 w-4 border-2 border-gray-300 border-t-brand-500 rounded-full animate-spin"></div>
            } @else {
              <app-ui-icon [iconName]="'clockRotateLeft'" [class]="'h-4 w-4 ' + view.iconClass"></app-ui-icon>
            }
          </div>
          @if (view.line1) {
            <div class="shrink-0 min-w-0">
              <p [class]="view.line1Class">{{ view.line1 }}</p>
              <p [class]="view.line2Class">{{ view.line2 }}</p>
            </div>
          }
        </div>
      </app-ui-option-card>
    } @else {
      <div class="w-40 h-14 rounded-lg border border-dashed border-gray-200"></div>
    }
  }
</div>
