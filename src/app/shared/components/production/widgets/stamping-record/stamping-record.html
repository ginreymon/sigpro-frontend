@if (visible()) {
<app-box-layout [title]="'Registro Hora'" >

  <div box-content class="flex flex-col">
    <app-ui-tabs class="w-full border-t border-slate-200 mt-4"
      [tabs]="tabs"
      [activeKey]="activeTab()"
      (tabChange)="onTabChange($event)">
    </app-ui-tabs>

    <div class="mt-4 min-h-[10rem]">
      @if (activeTab() === 'produccion') {
        <!-- contenido de Producción pendiente de definir -->
      } @else if (activeTab() === 'tiempos_adicionales') {
        <app-ui-loader [showLoader]="isLoadingAdditionalTimes()"></app-ui-loader>
        @if (!isLoadingAdditionalTimes()) {
          <app-searcher [live]="true" (onSearch)="searchAdditionalTimes($event)" class="sticky top-0 z-10 bg-white block mb-2"></app-searcher>
          <div class="grid grid-cols-1 gap-2 max-h-[50vh] overflow-y-auto">
            @for (item of filteredAdditionalTimes(); track item.id) {
              <app-additional-stamping-time-card
                [item]="item"
                [selected]="isSelected(item.id)"
                (onToggle)="toggleAdditionalTime(item.id)">
                <input quantity-input type="number" min="0"
                  class="w-16 text-xs text-right border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-brand-500"
                  placeholder="Cant."
                  [value]="getQuantity(item.id)"
                  (input)="setQuantity(item.id, $any($event.target).value)"
                  (click)="$event.stopPropagation()" />
              </app-additional-stamping-time-card>
            } @empty {
              <p class="text-sm text-gray-400 py-4 text-center">No hay tiempos adicionales</p>
            }
          </div>
        }
      }
    </div>
  </div>

  <div box-buttons class="w-full flex flex-row items-center gap-3">
    <app-shift-cycles-actions
      class="min-w-0 flex-1"
      [mode]="'labeled'"
      [inWindow]="inWindow"
      [config]="stampingConfig"
      [hiddenActions]="['stampingRecord']"
      (onFinalize)="onFinalize.emit()">
    </app-shift-cycles-actions>

    <app-ui-button class="ml-auto shrink-0" (onClick)="close()">
      <app-ui-icon [iconName]="'circleRight'" class="w-5 h-5"></app-ui-icon>
      Registrar
    </app-ui-button>
  </div>

</app-box-layout>
}
