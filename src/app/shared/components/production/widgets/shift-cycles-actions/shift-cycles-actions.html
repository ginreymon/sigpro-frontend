<app-drag-carousel [leadingPadding]="false" [verticalPadding]="false" [edgeFade]="true">
  @if (mode === 'icon') {
    @for (action of actions; track action.icon) {
      @if (!action.hideWhen?.()) {
        <app-ui-button [attr.title]="getTooltip(action)" [intent]="action.iconIntent" (onClick)="action.handler()">
          <app-ui-icon [iconName]="action.icon" class="w-5 h-5"></app-ui-icon>
        </app-ui-button>
      }
    }
  } @else {
    @for (action of actions; track action.icon) {
      @if (!action.hideWhen?.()) {
        <app-ui-button [intent]="'action'" (onClick)="action.handler()">
          <app-ui-icon [iconName]="action.icon" class="h-5 w-5"></app-ui-icon>
          {{ action.label }}
        </app-ui-button>
      }
    }
  }
</app-drag-carousel>
