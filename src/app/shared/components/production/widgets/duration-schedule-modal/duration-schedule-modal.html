@if(visible){
<app-box-layout [title]="'Horario del registro'" [classNames]="'max-w-md'">

    <div box-content class="flex flex-col justify-center items-center">

        <form class="w-full" [formGroup]="recordForm">
            <div class="space-y-5">

                <!-- Duración -->
                <div class="border border-slate-200 rounded-lg bg-slate-50 p-4">

                    <div class="flex flex-row justify-between items-center gap-3">

                        <div class="w-2/3">
                            <span class="text-sm text-slate-500 italic">
                                Ingresa el tiempo total empleado en realizar todas las unidades registradas.
                            </span>
                        </div>

                        <div class="w-1/3 flex justify-end">
                            <app-ui-hour-input formControlName="duration_minutes" [id]="'duration_minutes'" [title]="'Minutos'" [min]="1" [max]="999">
                            </app-ui-hour-input>
                        </div>

                    </div>

                </div>

                <!-- Horario -->
                <div>
                    <!--
                        Doble binding con start_time (duration-schedule-modal.ts):
                        ajustar los minutos recalcula la hora inicial, y viceversa.
                    -->
                    <app-time-range-fields
                        [startCtrl]="'start_time'"
                        [endCtrl]="'end_time'"
                        [initialEnd]="currentTimeHHmm"
                        [disableEnd]="true">
                    </app-time-range-fields>

                </div>

                @if(startBeforeShiftInvalid){
                    <app-ui-error-message>
                        La hora de inicio no puede ser anterior al inicio del turno
                        ({{ shiftStartTime?.slice(0, 5) }}).
                    </app-ui-error-message>
                }

            </div>
        </form>
    </div>

    <div box-buttons class="flex flex-row gap-3">
        <app-ui-button [intent]="'cancel'" (onClick)="onCancel.emit()">
            Cancelar
        </app-ui-button>

        <app-ui-button [disabled]="primaryActionDisabled" (onClick)="next()">
            Siguiente
        </app-ui-button>
    </div>

</app-box-layout>
}
