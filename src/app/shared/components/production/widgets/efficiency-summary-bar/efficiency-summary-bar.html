<div
  class="flex items-stretch overflow-hidden text-sm bg-white"
  [class.border]="bordered"
  [class.border-gray-200]="bordered"
  [class.rounded-lg]="bordered">
  <div class="flex-1 flex flex-col items-center justify-center px-1.5 py-1 gap-0 lg:px-4 lg:py-2 lg:gap-0.5">
    <span class="text-[10px] font-semibold tracking-tight text-slate-500 uppercase lg:text-xs lg:tracking-widest">Eficiencia</span>
    <span [class]="'text-sm font-bold tabular-nums lg:text-xl ' +efficiencyColor()">
      {{ efficiency.toFixed(2) }}%
    </span>
  </div>
  <div class="w-px bg-gray-200"></div>
  <div class="flex-1 flex flex-col items-center justify-center px-1.5 py-1 gap-0 lg:px-4 lg:py-2 lg:gap-0.5">
    <span class="text-[10px] font-semibold tracking-tight text-slate-500 uppercase lg:text-xs lg:tracking-widest">Completadas</span>
    <span [class]="'text-sm font-bold tabular-nums lg:text-xl ' +completedColor()">
      {{ completed }}
    </span>
  </div>
  @if (activeModules !== undefined) {
    <div class="w-px bg-gray-200"></div>
    <div class="flex-1 flex flex-col items-center justify-center px-1.5 py-1 gap-0 lg:px-4 lg:py-2 lg:gap-0.5">
      <span class="text-[10px] font-semibold tracking-tight text-slate-500 uppercase lg:text-xs lg:tracking-widest">Módulos</span>
      <span [class]="'text-sm font-bold tabular-nums lg:text-xl ' +modulesColor()">
        {{ activeModules }}
      </span>
    </div>
  }
  @if (showFilterButton) {
    <div class="w-px bg-gray-200"></div>
    <button type="button" (click)="filterToggle.emit()"
      class="flex items-center justify-center px-2.5 lg:px-3.5 cursor-pointer transition-colors"
      [class]="filterActive ? 'bg-brand-50 text-brand-600' : 'text-gray-400 hover:bg-gray-50 hover:text-gray-600'">
      <app-ui-icon [iconName]="'filter'" class="w-4 h-4 lg:w-5 lg:h-5"></app-ui-icon>
      <span class="sr-only">Filtrar</span>
    </button>
  }
</div>
