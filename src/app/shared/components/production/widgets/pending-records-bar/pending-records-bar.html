<div class="fixed bottom-4 inset-x-0 z-60 flex justify-center pointer-events-none">
  <div [class]="'pointer-events-auto flex items-center bg-gray-50 rounded-lg p-1.5 border border-gray-200 shadow-lg mx-auto transform transition-all duration-500 ease-out ' + (visible() ? 'translate-y-0 opacity-100' : '-translate-y-[100vh] opacity-0')">

    <div class="flex items-center space-x-4 px-3 text-sm text-gray-700">
      <div class="flex items-center">
        <app-ui-icon [iconName]="'fileLines'" class="h-4 w-4 mr-1.5 text-brand"></app-ui-icon>
        <span class="font-bold">{{ pendingCount() }}</span>
        <span class="ml-1 text-gray-500">{{ pendingCount() === 1 ? 'registro pendiente' : 'registros pendientes' }}</span>
      </div>

      <div class="w-px h-4 bg-gray-300"></div>

      <div class="flex items-center">
        <app-ui-icon [iconName]="'database'" class="h-4 w-4 mr-1.5 text-brand"></app-ui-icon>
        <span class="text-gray-500">Total unidades:</span>
        <strong class="ml-1 text-gray-900">{{ totalUnits() }}</strong>
      </div>
    </div>

    <app-ui-button (onClick)="save()">
      <app-ui-icon [iconName]="'upload'" class="h-4 w-4 mr-1.5"></app-ui-icon>
      Guardar
    </app-ui-button>

  </div>
</div>
