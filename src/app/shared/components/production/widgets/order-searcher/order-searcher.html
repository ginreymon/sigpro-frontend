<form id="orderForm" [formGroup]="orderForm" [class]="formClass()" (ngSubmit)="search()">

    @if(showHeader()){
    <div class="flex flex-col items-start justify-start border-b border-default border-gray-300 pb-4 md:pb-5 mb-2">
        <h3 class="text-2xl font-semibold text-heading" [class]="titleClass()">
            {{ title() }}
        </h3>
        <p class="text-gray-500 mt-2 text-sm w-full">
            {{ description() }}
        </p>
    </div>
    }

    <fieldset class="w-full flex flex-col justify-start mt-4">

        <div class="w-full flex flex-row justify-start gap-1.5">
            <app-ui-form-field [controlName]="'documentType'" [label]="'Tipo'">
                <app-ui-select formControlName="documentType" [className]="'min-w-40'" [control]="documentType" [items]="visibleDoctypes()"
                    [key]="'doc_type'" [showDefaultOption]="true"></app-ui-select>
            </app-ui-form-field>

            <app-ui-form-field [controlName]="'documentNumber'" [label]="'Número'">
                <div class="w-full flex flex-row justify-start gap-1.5">
                    <div class="relative w-full">
                        <app-ui-input [type]="'number'" formControlName="documentNumber" [id]="'documentNumber'" [placeholder]="'Número'" [control]="documentNumber"></app-ui-input>
                        @if(documentNumber?.value){
                        <a class="absolute right-3 top-1/2 -translate-y-1/2" (click)="clear()">
                            <app-ui-icon [iconName]="'xmark'" [class]="`h-5 w-5`"
                                [appUiIconState]="documentNumber?.invalid!"></app-ui-icon>
                        </a>
                        }
                    </div>
                    <app-ui-button [type]="'submit'" [formId]="'orderForm'">
                        <app-ui-icon [iconName]="'magnifyingGlass'" [class]="'h-5 w-5'"></app-ui-icon>
                        Buscar
                    </app-ui-button>
                </div>
            </app-ui-form-field>
        </div>

        @if(errorMessage()){
        <app-ui-error-message>{{ errorMessage() }}</app-ui-error-message>
        }

        @if(isTraceability && results().length){
        <div class="mt-1 grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-36 overflow-y-auto p-3 bg-gray-100 rounded-md border border-gray-200">
            @for(order of results(); track order.rowId){
            <app-ui-option-card [obj]="order" (onToggle)="selectResult($event)">
                <div class="flex items-center justify-between gap-2">
                    <p class="text-sm font-semibold text-gray-900 truncate">{{ order.documentType }} {{ order.documentNumber }}</p>
                    <app-ui-badge
                        class="shrink-0"
                        [intent]="order.stampingAudit?.isAudited && order.stampingAudit?.quantitiesMatch ? 'active' : 'inactive'"
                        [label]="order.stampingAudit?.isAudited && order.stampingAudit?.quantitiesMatch ? 'Auditada (Estampación)' : 'Sin auditar (Estampación)'">
                    </app-ui-badge>
                </div>
            </app-ui-option-card>
            }
        </div>
        }

    </fieldset>

</form>
