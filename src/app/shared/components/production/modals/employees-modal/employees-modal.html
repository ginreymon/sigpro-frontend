<app-modal-layout [visible]="visible" [title]="'Encomendados'" [acceptLabel]="'Actualizar'" [hideAccept]="readOnly" (onAccept)="save()" (onCancel)="cancel()">

  <app-ui-form-section>
  <app-ui-form-field [label]="'Empleados'">
    <div class="flex flex-col max-h-[50vh]">
      <app-employee-picker
        [employees]="sortedEmployees()"
        [selectedIds]="selectedIds()"
        [multiSelect]="true"
        [selectable]="!readOnly"
        [showSelectionBar]="true"
        [apprenticeIds]="currentApprenticeIds()"
        [showApprenticeStatus]="showApprenticeStatus || apprenticeEditable"
        [apprenticeEditable]="apprenticeEditable"
        [showModule]="true"
        (onToggle)="toggle($event)"
        (onToggleApprentice)="toggleApprentice($event)">
      </app-employee-picker>
    </div>
  </app-ui-form-field>
  </app-ui-form-section>

  @if (attempted() && selectedIds().length === 0) {
    <app-ui-error-message>Debe seleccionar al menos un empleado</app-ui-error-message>
  }

</app-modal-layout>
