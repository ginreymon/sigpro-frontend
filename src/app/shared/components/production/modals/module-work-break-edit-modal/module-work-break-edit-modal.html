<app-bottom-sheet-shell [visible]="visible" [title]="title()" [fullscreen]="false" (onClose)="close()">

  <app-ui-tabs [tabs]="tabs" [activeKey]="activeTab()" [variant]="'raised'" (tabChange)="activeTab.set($event)"></app-ui-tabs>

  <div class="pt-4">
    <div [class.hidden]="activeTab() !== 'tiempo'">
      <app-work-break-tiempo-tab [visible]="visible" [row]="row"></app-work-break-tiempo-tab>
    </div>
  </div>

</app-bottom-sheet-shell>
