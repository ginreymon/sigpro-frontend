<div [class]="'fixed inset-0 z-50 ' + (visible ? 'pointer-events-auto' : 'pointer-events-none')">

  <div
    [class]="'fixed inset-0 bg-slate-900/40 transition-opacity duration-300 ' + (visible ? 'opacity-100' : 'opacity-0')"
    (click)="close()">
  </div>

  <div role="dialog" aria-modal="true" [class]="'fixed inset-x-0 ' + (fullscreen ? 'top-0' : 'top-16 rounded-t-xl') + ' bottom-0 bg-white shadow-xl overflow-hidden transition-transform duration-300 ' + (visible ? 'translate-y-0' : 'translate-y-full')">

    <div class="h-full flex flex-col">

      <div class="shrink-0 flex items-start justify-between gap-4 border-b border-slate-200 px-4 sm:px-6 py-4">
        <div class="flex flex-wrap items-center gap-2 min-w-0">
          <h3 class="text-lg font-semibold text-slate-900">{{ title }}</h3>
          <app-ui-modal-badge [purpose]="purpose"></app-ui-modal-badge>
        </div>
        <app-ui-close-button (onClose)="close()"></app-ui-close-button>
      </div>

      <div class="flex-1 min-h-0 overflow-y-auto px-4 sm:px-6 py-4">
        <ng-content></ng-content>
      </div>

      <div class="shrink-0 border-t border-slate-200 bg-slate-50 px-4 sm:px-6 py-3 flex justify-end">
        <app-ui-button [intent]="'cancel'" (onClick)="close()">Cerrar</app-ui-button>
      </div>

    </div>

  </div>

</div>
