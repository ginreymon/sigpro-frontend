@if(openModal()){
<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 overflow-x-hidden overflow-y-auto transition-transform duration-300">

  <div role="dialog" aria-modal="true"
    [class]="`bg-white rounded-xl shadow-xl w-full max-h-[90vh] flex flex-col overflow-hidden mx-2 sm:mx-4 ${classNames?classNames:'max-w-xl'}`">

    <!-- Header -->
    <div class="shrink-0 flex items-start justify-between gap-4 border-b border-slate-200 px-4 sm:px-6 py-4">

      <div class="min-w-0">
        <div class="flex flex-wrap items-center gap-2">
          <h3 class="text-lg font-semibold text-slate-900" [class.uppercase]="uppercaseTitle">{{ title | titlecase }}</h3>
          <app-ui-modal-badge [purpose]="mode"></app-ui-modal-badge>
        </div>
        @if (subtitle) {
        <p class="mt-0.5 text-sm text-slate-500">{{ subtitle }}</p>
        }
      </div>

      <app-ui-close-button (onClose)="close()"></app-ui-close-button>

    </div>

    <!-- modal-top: context, status, intro -->
    <div class="shrink-0 text-slate-600 empty:hidden px-4 sm:px-6 pt-4">
      <ng-content select="[modal-top]"></ng-content>
    </div>

    <!-- Default slot: form / sections -->
    <div class="flex-1 min-h-0 space-y-4 px-4 sm:px-6 py-4 text-slate-600 overflow-y-auto">

      <ng-content></ng-content>

    </div>

    <!-- modal-bottom: footer info above the actions -->
    <div class="shrink-0 text-slate-600 empty:hidden px-4 sm:px-6 pb-4">
      <ng-content select="[modal-bottom]"></ng-content>
    </div>

    <!-- Actions -->
    <div class="shrink-0 flex flex-col-reverse sm:flex-row sm:justify-end sm:items-center gap-2 sm:gap-3 border-t border-slate-200 bg-slate-50 px-4 sm:px-6 py-3">

      @if(!hideCancel){
      <app-ui-button [intent]="'cancel'" [classNames]="'w-full sm:w-auto'" (onClick)="close()">
        {{ cancelLabel ?? 'Cancelar'}}
      </app-ui-button>
      }

      @if(!hideAccept){
      <app-ui-button [formId]="formId" [classNames]="'w-full sm:w-auto sm:min-w-24 font-semibold'" [type]="submit?'submit':'button'" [disabled]="acceptDisabled" (onClick)="accept()">
        {{ acceptLabel ?? 'Aceptar'}}
      </app-ui-button>
      }

    </div>

  </div>

</div>
}
