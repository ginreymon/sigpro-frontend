@if(openModal()){
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 bg-opacity-10 overflow-x-hidden overflow-y-auto text-gray-300 transition-transform duration-300">

  <div [class]="`bg-white px-3 sm:px-6 py-3 sm:py-6 rounded-xl shadow-xl w-full max-h-[90vh] flex flex-col mx-4 ${classNames?classNames:'max-w-xl'}`">

    <div class="flex items-center justify-between border-b border-default pb-4 md:pb-5">

      <div class="min-w-0">
        <div class="flex flex-wrap items-center gap-2">
          <h3 class="text-lg font-medium text-heading text-gray-900" [class.uppercase]="uppercaseTitle">{{ title | titlecase }}</h3>
          @if (mode === 'create' || mode === 'edit') {
          <span class="rounded-full px-2 py-0.5 text-xs font-medium"
            [class]="mode === 'create' ? 'bg-brand-50 text-brand-500' : 'bg-amber-50 text-amber-700'">
            {{ mode === 'create' ? 'Nuevo' : 'Editando' }}
          </span>
          }
        </div>
        @if (subtitle) {
        <p class="mt-0.5 text-sm text-slate-500">{{ subtitle }}</p>
        }
      </div>

      <app-ui-close-button (onClose)="close()"></app-ui-close-button>

    </div>

    <div class="shrink-0 text-gray-600 empty:hidden pt-4 md:pt-6">
      <ng-content select="[modal-top]"></ng-content>
    </div>

    <div class="flex-1 min-h-0 space-y-4 md:space-y-6 py-4 md:py-2 text-gray-600 overflow-y-auto">

      <ng-content></ng-content>

    </div>

    <div class="shrink-0 text-gray-600 empty:hidden pb-4 md:pb-6">
      <ng-content select="[modal-bottom]"></ng-content>
    </div>

    <div class="flex flex-col-reverse sm:flex-row sm:justify-end sm:items-center gap-2 sm:gap-3 border-t border-default pt-4 md:pt-5">
    
      @if(!hideCancel){
      <app-ui-button [intent]="'cancel'" [classNames]="'w-full sm:w-auto'" (onClick)="close()">
        {{ cancelLabel ?? 'Cancelar'}}
      </app-ui-button>
      }
    
      @if(!hideAccept){
      <app-ui-button [formId]="formId" [classNames]="'w-full sm:w-auto sm:min-w-24 font-semibold'" [type]="submit?'submit':'button'" [disabled]="acceptDisabled" (onClick)="accept()">
        {{ acceptLabel ?? 'Aceptar'}}
      </app-ui-button>
      }
    
    </div>

  </div>
  
</div>
}
