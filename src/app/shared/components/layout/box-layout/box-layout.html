<div class="fixed inset-0 flex items-center justify-center overflow-x-hidden overflow-y-auto transition-all duration-300 cursor-default" [ngClass]="zClass"
     [class]="transparent ? 'bg-transparent cursor-pointer' : 'bg-black/50 bg-opacity-10'"
     (click)="transparent && onRestoreClick.emit()">
    <div [class]="`bg-white px-3 sm:px-6 py-3 sm:py-6 rounded-lg shadow-xl w-full max-h-[90vh] flex flex-col mx-1 transition-opacity duration-300 ${classNames ? classNames : 'max-w-xl'}`"
         [class.opacity-20]="transparent">

        @if(title){
        <div class="flex items-center justify-between shrink-0">
            <h2 class="text-lg font-semibold text-gray-900">{{ title | titlecase }}</h2>
            <ng-content select="[box-header-actions]"></ng-content>
        </div>
        }

        @if(message){
        <p class="text-gray-600 mt-2 shrink-0">{{ message }}</p>
        }

        <div class="flex-1 min-h-0 overflow-y-auto">
            <ng-content select="[box-content]"></ng-content>
        </div>

        <div class="mt-4 flex justify-end gap-3 shrink-0">
            <ng-content select="[box-buttons]"></ng-content>
        </div>

    </div>
</div>
