<div [class]="'fixed inset-0 z-50 flex transform ' + (initialized() ? 'transition-transform duration-300 ' : '') + (openModal() ? 'translate-x-0' : 'translate-x-full')">

  <div [class]="'fixed inset-0 bg-slate-900/40 '+(openModal() ? 'transition-opacity opacity-100 delay-300' : 'opacity-0')" (click)="close()"></div>

  <div role="dialog" aria-modal="true" class="relative ml-auto w-full max-w-xl h-full bg-white shadow-xl rounded-l-xl overflow-hidden">

    <div class="flex flex-col h-full">

      <div class="shrink-0 flex items-start justify-between gap-4 border-b border-slate-200 px-4 sm:px-6 py-4">
        <h3 class="text-lg font-semibold text-slate-900">
          {{ title | titlecase }}
        </h3>

        <app-ui-close-button [className]="noHover ? 'border-gray-300 text-gray-600' : null" (onClose)="close()"></app-ui-close-button>
      </div>

      <div class="flex-1 min-h-0 space-y-4 px-4 sm:px-6 py-4 overflow-y-auto text-slate-600">
        <ng-content></ng-content>
      </div>

      <div class="shrink-0 border-t border-slate-200 bg-slate-50 px-4 sm:px-6 py-3 flex justify-end gap-3">

        @if(!hideCancel){
        <app-ui-button intent="cancel" [noHover]="noHover" (onClick)="close()">
          {{ cancelLabel ?? 'Cancelar'}}
        </app-ui-button>
        }

        @if(!hideAccept){
        <app-ui-button [noHover]="noHover" (onClick)="accept()">
          {{ acceptLabel ?? 'Aceptar'}}
        </app-ui-button>
        }

      </div>

    </div>

  </div>
</div>
