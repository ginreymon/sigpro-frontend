@if(visible()){
<app-box-layout [title]="'Ingresar cantidades'">

    <div box-content class="flex flex-col justify-center items-center">

        <app-sku-detail class="w-full" [selectedSKU]="selectedSKU"></app-sku-detail>

        <form id="quantityForm" class="w-full mt-4" [formGroup]="recordForm">
            <fieldset>
                <app-ui-form-field [controlName]="'completed_quantity'" [label]="'Completadas'">
                    <app-ui-large-input [type]="'number'" formControlName="completed_quantity" [placeholder]="'0'"></app-ui-large-input>
                </app-ui-form-field>

                <app-ui-form-field [controlName]="'rejected_quantity'" [label]="'Saldos'">
                    <app-ui-large-input [type]="'number'" formControlName="rejected_quantity" [placeholder]="'0'"></app-ui-large-input>
                </app-ui-form-field>

                <app-ui-form-field [controlName]="'scrap_quantity'" [label]="'Bajas'">
                    <app-ui-large-input [type]="'number'" formControlName="scrap_quantity" [placeholder]="'0'"></app-ui-large-input>
                </app-ui-form-field>
            </fieldset>
        </form>

        <app-sku-quantity-summary class="w-full" [selectedSKU]="selectedSKU"></app-sku-quantity-summary>
    </div>

    <div box-buttons class="flex flex-row gap-3">
        <app-ui-button [intent]="'cancel'" [disabled]="isSubmitting()" (onClick)="cancel()">
            Cancelar
        </app-ui-button>

        <app-ui-button [disabled]="recordForm.invalid || isSubmitting()" (onClick)="save()">
            Guardar
        </app-ui-button>
    </div>

</app-box-layout>
}
