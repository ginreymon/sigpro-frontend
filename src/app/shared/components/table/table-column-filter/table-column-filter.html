<div #panel [ngStyle]="style()" [class.hidden]="!isOpen()"
     class="bg-white border border-gray-200 rounded-lg shadow-xl">

    <div class="px-3 py-2 border-b border-gray-100 flex items-center justify-between gap-4">
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Filtrar</span>
        @if (isActive) {
        <button
            type="button"
            (click)="clearFilter.emit()"
            class="text-xs text-red-600 hover:text-red-800 font-medium cursor-pointer">
            Limpiar
        </button>
        }
    </div>

    <div class="overflow-y-auto overscroll-contain py-1" [style.max-height]="listMaxHeight()">
        @for (val of values; track val) {
        <label class="flex items-center gap-2.5 px-3 py-1.5 hover:bg-gray-50 cursor-pointer select-none">
            <input
                type="checkbox"
                [checked]="isValueChecked(val)"
                (change)="toggleValue.emit(val)"
                class="rounded border-gray-300 w-3.5 h-3.5 cursor-pointer accent-brand-600">
            <span class="text-sm text-gray-700 truncate">{{ val }}</span>
        </label>
        }
        @if (values.length === 0) {
        <p class="px-3 py-2 text-sm text-gray-400 italic">Sin valores</p>
        }
    </div>

</div>
