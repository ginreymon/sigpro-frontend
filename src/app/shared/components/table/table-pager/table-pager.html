<div class="w-full flex flex-col items-center sm:flex-row sm:items-center justify-between gap-2 sm:gap-0 mt-4 mb-2 sm:mb-0">

    <div class="flex flex-wrap sm:flex-nowrap items-center justify-center sm:justify-start gap-1 sm:gap-2 text-xs sm:text-sm text-gray-600 w-full">

        <span class="font-medium">{{ startItem }}</span>
        –
        <span class="font-medium">{{ endItem }}</span>
        de
        <span class="font-medium">{{ totalItems }}</span>
        resultados

        <app-ui-select [items]="rowsPerPage" [(ngModel)]="pageSize" (onSelect)="changePageSize($event)"></app-ui-select>

    </div>

    <div class="flex items-center justify-center sm:justify-start gap-0.5 sm:gap-1 overflow-x-auto sm:overflow-visible max-w-full scale-90 sm:scale-100 origin-center [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden">

        <app-ui-button [intent]="'hover'" (click)="goToPage(1)" [disabled]="currentPage == 1">
            <app-ui-icon [iconName]="'chevronLeftToLine'" [class]="'w-4 h-4 sm:w-5 sm:h-5'"></app-ui-icon>
        </app-ui-button>

        <app-ui-button [intent]="'hover'" (click)="goToPage(currentPage - 1)" [disabled]="currentPage == 1">
            <app-ui-icon [iconName]="'chevronLeft'" [class]="'w-4 h-4 sm:w-5 sm:h-5 py-0.5'"></app-ui-icon>
        </app-ui-button>

        @if(showFirst){
        <app-ui-button [intent]="currentPage == 1? 'accept':'hover'" (click)="goToPage(1)">
            1
        </app-ui-button>
        }
        
        @if (showLeftEllipsis) {
        <span class="px-2 text-gray-400">...</span>
        }

        @for (page of visiblePages; track page) {
        <app-ui-button [intent]="page == currentPage? 'accept':'hover'" (click)="goToPage(page)">
            {{ page }}
        </app-ui-button>
        }

        @if (showRightEllipsis) {
        <span class="px-2 text-gray-400">...</span>
        }

        @if(showLast){
        <app-ui-button [intent]="totalPages == currentPage? 'accept':'hover'" (click)="goToPage(totalPages)">
            {{ totalPages }}
        </app-ui-button>
        }        

        <app-ui-button [intent]="'hover'" (click)="goToPage(currentPage + 1)" [disabled]="currentPage == totalPages">
            <app-ui-icon [iconName]="'chevronRight'" [class]="'w-4 h-4 sm:w-5 sm:h-5 py-0.5'"></app-ui-icon>
        </app-ui-button>

        <app-ui-button [intent]="'hover'" (click)="goToPage(totalPages)" [disabled]="currentPage == totalPages">
            <app-ui-icon [iconName]="'chevronRightToLine'" [class]="'w-4 h-4 sm:w-5 sm:h-5'"></app-ui-icon>
        </app-ui-button>

    </div>

</div>
