@if (cards().length > 0) {
<div class="bg-gray-200 text-gray-700 border border-gray-200 rounded-md px-3 py-1.5 mb-2 flex flex-row justify-between">
  @for (card of cards(); track card.title) {
    <div class="px-2">
      <h3 class="text-slate-500 text-xs">{{ card.title }}</h3>

      @if (card.action) {
        <div class="flex flex-row gap-1 items-center mt-0.5 cursor-pointer rounded hover:text-gray-700 hover:bg-gray-100 transition-colors" (click)="card.action()">
          @if (card.iconName) {
            <app-ui-icon [iconName]="card.iconName" class="h-4 w-4"></app-ui-icon>
          }
          <p [class]="getDataClasses(card)">
            {{ card.data.toString() | uppercase }}
          </p>
        </div>
      }
            
      @else {
        <div class="flex flex-row gap-1 items-center mt-0.5">
          @if (card.iconName) {
            <app-ui-icon [iconName]="card.iconName" class="h-4 w-4"></app-ui-icon>
          }
          <p [class]="getDataClasses(card)">
            {{ card.data.toString() | uppercase }} {{ card.title == 'Eficiencia'?'%':'' }}
          </p>
        </div>
      }
    </div>
  }
</div>
}
