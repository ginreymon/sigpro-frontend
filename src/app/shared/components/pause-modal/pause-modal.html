@if(state().showPauseModal){
<app-box-layout [title]="'Pausar'">

    <div box-content class="flex flex-col justify-center items-center py-4">
        <p class="text-gray-600 text-center">
            ¿Desea pausar la tarea en curso?
        </p>
    </div>

    <div box-buttons class="flex flex-row gap-3">
        <app-ui-button [intent]="'cancel'" (onClick)="cancel()">
            Cancelar
        </app-ui-button>
    </div>

</app-box-layout>
}
