@if(cards.length){
<div class="w-full flex flex-row justify-between mt-4 py-4 border-y border-slate-200">
    @for (card of cards; track $index; let last = $last) {
    <div [class]="'flex flex-col ' + (last ? 'items-end text-right' : '')">
        <h3 class="text-slate-500 text-xs">{{ card.title }}</h3>
        <p class="text-m font-semibold text-slate-900 mb-1">
            {{ card.data.toString() | uppercase }}
        </p>
    </div>
    }            
</div>
}
