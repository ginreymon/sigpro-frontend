<app-modal-layout [visible]="visible" [title]="'Módulo'" [acceptLabel]="'Seleccionar'" (onAccept)="save()" (onCancel)="cancel()">

  <app-searcher #searcher [intent]="'action'" (onSearch)="search($event)"></app-searcher>

  <app-ui-form-field [label]="'Módulo'">
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3 items-stretch overflow-y-auto max-h-[30vh] py-2">
      @for (module of filtered(); track module.id) {
        <app-ui-option-card [selected]="isSelected(module.id)" (onToggle)="select(module)">
          <div class="flex flex-row justify-start gap-2 items-center">
            <app-ui-icon [iconName]="'screwdriverWrench'" class="h-5 w-5"></app-ui-icon>
            <p class="font-medium text-sm">{{ module.number }}
              <span class="text-xs text-gray-500"> {{ module.name | titlecase | ellipsis:25 }}</span>
            </p>
          </div>
          @if (module.work_center) {
            <div class="text-xs text-gray-500 mt-1">{{ module.work_center.description | titlecase }}</div>
          }
        </app-ui-option-card>
      }
    </div>
  </app-ui-form-field>

  @if(attempted() && !selectedId) {
    <app-ui-error-message>Debe seleccionar un módulo</app-ui-error-message>
  }

</app-modal-layout>
