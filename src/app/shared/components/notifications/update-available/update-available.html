@if (updateService.updateAvailable()) {
<div class="fixed inset-0 z-[10000] flex flex-col items-center justify-center gap-4 bg-gray-100 px-4 text-center">
  <span class="text-2xl font-semibold uppercase tracking-widest text-gray-400">SIGPRO</span>
  <h2 class="text-2xl font-semibold text-slate-900">Hay una nueva versión disponible</h2>
  <p class="max-w-md text-sm text-slate-600">
    Actualiza para cargar la versión más reciente. Tu sesión se mantiene abierta.
  </p>
  <app-ui-button (onClick)="updateService.applyUpdate()">Actualizar</app-ui-button>
</div>
}
