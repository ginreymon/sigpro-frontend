@if(openModal()){
<div class="fixed top-14 right-4 z-60 pointer-events-none">
  
  <div [class]="'pointer-events-auto bg-brand-100 border border-brand-200 text-brand-700 shadow-xl rounded-lg p-4 w-80 transform transition-all duration-300 ease-out '+(openModal()?'translate-x-0 opacity-100':'translate-x-full opacity-0')">

    <div class="flex flex-row justify-start items-start gap-3">
      
      <div class="mt-1"> 
        <div class="flex items-center justify-center w-8 h-8 rounded-full bg-brand-200">
          <app-ui-icon [iconName]="iconName!" [class]="'w-5 h-5'"></app-ui-icon>
        </div>
      </div>
    
      <div class="flex-1">
        <h4 class="text-sm font-semibold"> {{ title }} </h4>
        <p class="text-xs"> {{ message }} </p>
      </div>      
    
      <app-ui-close-button (onClose)="close()" [className]="'border-brand-600 text-brand-600 hover:bg-brand-200'"></app-ui-close-button>

    </div>

  </div>

</div>
}
