@if(openModal()){
<app-box-layout [message]="message" [title]="title" [classNames]="'max-w-md'">

  @if(!hideCancel){
  <app-ui-button box-buttons [intent]="'cancel'" (onClick)="closeConfirm()">
    {{ cancelLabel ?? 'Cancelar' }}
  </app-ui-button>
  }

  <app-ui-button box-buttons (onClick)="accept()">
    {{ acceptLabel ?? 'Aceptar' }}
  </app-ui-button>

</app-box-layout>
}
