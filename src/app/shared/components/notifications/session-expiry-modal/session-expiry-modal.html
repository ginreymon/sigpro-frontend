@if (session.warningVisible()) {
<app-box-layout [title]="'Tu sesión está por expirar'" [classNames]="'max-w-md'" [zClass]="'z-[10001]'"
  [message]="'Por inactividad, tu sesión expirará en ' + timeLeft() + '. ¿Deseas continuar?'">

  <app-ui-button box-buttons [intent]="'cancel'" (onClick)="session.logoutNow()">
    Cerrar sesión
  </app-ui-button>

  <app-ui-button box-buttons (onClick)="session.continueSession()">
    Continuar sesión
  </app-ui-button>

</app-box-layout>
}
