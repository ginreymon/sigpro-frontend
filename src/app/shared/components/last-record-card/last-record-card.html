@if (lastRecordLoading()) {
  <div class="mt-3 rounded-lg border border-gray-200 p-3 flex items-center gap-3">
    <div class="h-8 w-8 skeleton rounded-md shrink-0"></div>
    <div class="flex-1 space-y-1.5">
      <div class="h-3 skeleton rounded w-1/4"></div>
      <div class="h-4 skeleton rounded w-1/3"></div>
    </div>
  </div>
} @else if (lastRecord()) {
  <button
    type="button"
    class="mt-3 w-fit text-left rounded-lg border border-gray-200 bg-white p-3 flex items-center gap-3 hover:border-brand-400 hover:bg-brand-50 transition-colors cursor-pointer"
    (click)="navigate()">
    <div class="flex items-center justify-center h-8 w-8 rounded-md bg-gray-100 shrink-0">
      <app-ui-icon [iconName]="'clockRotateLeft'" class="h-4 w-4 text-brand-500"></app-ui-icon>
    </div>
    <div class="shrink-0">
      <p class="text-xs text-gray-400">Última OP</p>
      <p class="text-sm font-semibold text-gray-700">{{ lastRecord()!.op_type }} {{ lastRecord()!.op_number }}</p>
    </div>
    <app-ui-icon [iconName]="'chevronRight'" class="h-4 w-4 text-gray-400 shrink-0"></app-ui-icon>
  </button>
} @else {
  <div class="w-full flex flex-col items-center justify-center gap-3 py-8">
    <app-ui-icon [iconName]="'clockRotateLeft'" class="h-10 w-10 text-gray-400"></app-ui-icon>
    <p class="text-sm text-gray-500">No hay OPs registradas</p>
  </div>
}
