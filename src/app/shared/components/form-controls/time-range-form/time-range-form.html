<form [formGroup]="form" class="flex flex-row items-start gap-4 w-full">

  <app-time-range-fields class="flex-1"></app-time-range-fields>

  <app-ui-button
    [classNames]="'mt-5'"
    [disabled]="form.invalid"
    [type]="'button'"
    (onClick)="submit()">
    <app-ui-icon [iconName]="'magnifyingGlass'" [class]="'w-4 h-4'"></app-ui-icon>
    Consultar
  </app-ui-button>

</form>
