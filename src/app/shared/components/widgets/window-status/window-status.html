@if (inWindow()) {
  <p class="w-full flex items-center gap-2 text-sm text-brand-700 text-left bg-brand-100 border border-brand-200 rounded-lg px-3 py-2" role="status">
    <span class="relative flex h-2 w-2 shrink-0" aria-hidden="true">
      <span class="motion-safe:animate-ping absolute inline-flex h-full w-full rounded-full bg-brand opacity-75"></span>
      <span class="relative inline-flex h-2 w-2 rounded-full bg-brand"></span>
    </span>
    <span>Ventana de registro activa de <span class="font-medium">{{ range().start }}</span> a <span class="font-medium">{{ range().end }}</span>.</span>
  </p>
} @else {
  <p class="w-full text-sm text-slate-600 text-left bg-gray-100 border border-gray-200 rounded-lg px-3 py-2">
    Podrá registrar las cantidades de <span class="font-medium">{{ range().start }}</span> a <span class="font-medium">{{ range().end }}</span>.
  </p>
}
