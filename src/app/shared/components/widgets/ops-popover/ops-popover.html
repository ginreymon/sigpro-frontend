<span class="inline-block" (click)="toggle($event)" [attr.aria-expanded]="!!card()" aria-haspopup="dialog">
    <app-ui-label-button [classNames]="'w-24'" [intent]="'cancel'">
        {{ label }}
        <app-ui-icon [iconName]="'upRightFromSquare'" [class]="'w-3 h-3 text-brand-400'"></app-ui-icon>
    </app-ui-label-button>
</span>

@if (card(); as c) {
<div class="fixed inset-0 z-40" (click)="close()"></div>
<div class="fixed z-50 flex flex-col bg-white border border-slate-200 rounded-lg shadow-lg text-left" role="dialog"
    [attr.aria-label]="'OPs de ' + title" [style.top.px]="c.top" [style.bottom.px]="c.bottom"
    [style.left.px]="c.left" [style.width.px]="c.width" [style.max-height.px]="c.maxHeight">
    <p class="shrink-0 px-3 py-2 text-xs font-semibold text-slate-500 border-b border-slate-100 truncate">
        {{ title }} · {{ label }}
    </p>
    <ul class="min-h-0 flex-1 overflow-y-auto divide-y divide-slate-100">
        @for (item of items; track $index) {
        <li class="px-3 py-1.5 min-w-0">
            <p class="text-sm font-medium text-gray-700 truncate">{{ item.title }}</p>
            @if (item.subtitle) {
            <p class="text-xs text-slate-500 truncate">{{ item.subtitle }}</p>
            }
        </li>
        }
    </ul>
</div>
}
