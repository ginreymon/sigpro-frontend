<section class="bg-white border border-slate-200 rounded-lg p-4 flex flex-col gap-3">
  <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500">{{ title() }}</h2>

  <!-- Optional controls that stay visible in every state (e.g. filters that can change the state). -->
  <ng-content select="[sectionFilters]"></ng-content>

  <!-- bodyClass (e.g. 'h-80') fixes the body height so every state keeps the same card size. -->
  <div [class]="bodyClass() ? bodyClass() + ' flex items-center justify-center' : ''">
  @switch (state()) {
    @case ('loading') {
      <div class="flex w-full flex-col gap-2" role="status" aria-live="polite">
        <div class="h-8 rounded bg-gray-100 motion-safe:animate-pulse"></div>
        <div class="h-24 rounded bg-gray-100 motion-safe:animate-pulse"></div>
        <span class="sr-only">Cargando información</span>
      </div>
    }
    @case ('error') {
      <p class="text-sm text-slate-500" role="alert">No se pudo cargar la información. Intenta de nuevo.</p>
    }
    @case ('empty') {
      <p class="text-sm text-slate-500">{{ emptyMessage() }}</p>
    }
    @default {
      <ng-content></ng-content>
    }
  }
  </div>
</section>
