@if (numericValue() !== null) {
  <span [class]="valueClass" (click)="toggleOpen($event)">{{ value }}</span>
} @else {
  <span [class]="emptyClass" (click)="handleEmptyClick($event)">{{ emptyLabel }}</span>
}

@if (open()) {
  <div [style]="style()" class="bg-white rounded-lg shadow-lg border border-slate-200 p-3 space-y-2" (click)="$event.stopPropagation()">
    <ng-content></ng-content>
  </div>
}
