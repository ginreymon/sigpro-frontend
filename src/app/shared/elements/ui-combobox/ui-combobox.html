<div>
  <!-- Señuelos: Chrome ignora autocomplete="off"/type/readonly en el input real de
       búsqueda y le mete ahí la cuenta con sesión activa, incluso fuera de un <form>.
       Dándole aquí un username/password "de manual" para autorellenar, deja el campo
       real en paz. Ocultos fuera de pantalla, no display:none (Chrome los ignoraría). -->
  <input type="text" name="username" autocomplete="username" tabindex="-1" aria-hidden="true"
    style="position:absolute; left:-9999px; top:-9999px; width:1px; height:1px; opacity:0;" />
  <input type="password" name="password" autocomplete="current-password" tabindex="-1" aria-hidden="true"
    style="position:absolute; left:-9999px; top:-9999px; width:1px; height:1px; opacity:0;" />

  <input
    [id]="id"
    [name]="id"
    type="text"
    autocomplete="off"
    [readonly]="!focused()"
    [class]="`
      h-8
      w-full
      px-4
      text-sm
      rounded
      border
      bg-white
      outline-none
      transition-all
      duration-200
      focus:ring-2
      ${invalid
        ? 'border-red-500 focus:border-red-500 focus:ring-red-200'
        : 'border-gray-300 focus:border-brand-500 focus:ring-brand-200'}
      ${className}
    `"
    [placeholder]="placeholder"
    [value]="searchText()"
    [disabled]="disabled"
    (input)="onInputChange($any($event.target).value)"
    (focus)="focused.set(true); onFocus()"
    (keydown)="onKeyDown($event)"
    (blur)="onBlur()"
  />

  <ul
    #dropdown
    [style]="style()"
    [class.hidden]="!isOpen()"
    class="max-h-56 overflow-auto rounded border border-gray-300 bg-white text-sm shadow-lg"
  >
    @for (item of filteredItems(); track item; let i = $index) {
    <li
      [attr.data-index]="i"
      [class]="`
        cursor-pointer
        px-4
        py-1.5
        ${i === activeIndex() ? 'bg-brand-100' : 'hover:bg-gray-100'}
      `"
      (mousedown)="$event.preventDefault(); selectItem(item)"
    >
      {{ key ? item[key] : item }}
    </li>
    } @empty {
    <li class="px-4 py-1.5 text-gray-400">Sin resultados</li>
    }
  </ul>
</div>
