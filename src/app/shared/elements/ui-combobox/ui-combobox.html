<div>
  <input
    [id]="id"
    [name]="id"
    type="text"
    autocomplete="off"
    [class]="`
      h-8
      w-full
      px-4
      text-sm
      rounded
      border
      bg-white
      outline-none
      transition-all
      duration-200
      focus:ring-2
      ${invalid
        ? 'border-red-500 focus:border-red-500 focus:ring-red-200'
        : 'border-gray-300 focus:border-brand-500 focus:ring-brand-200'}
      ${className}
    `"
    [placeholder]="placeholder"
    [value]="searchText()"
    [disabled]="disabled"
    (input)="onInputChange($any($event.target).value)"
    (focus)="onFocus()"
    (keydown)="onKeyDown($event)"
    (blur)="onBlur()"
  />

  <ul
    #dropdown
    [style]="style()"
    [class.hidden]="!isOpen()"
    class="max-h-56 overflow-auto rounded border border-gray-300 bg-white text-sm shadow-lg"
  >
    @for (item of filteredItems(); track item; let i = $index) {
    <li
      [attr.data-index]="i"
      [class]="`
        cursor-pointer
        px-4
        py-1.5
        ${i === activeIndex() ? 'bg-brand-100' : 'hover:bg-gray-100'}
      `"
      (mousedown)="$event.preventDefault(); selectItem(item)"
    >
      {{ key ? item[key] : item }}
    </li>
    } @empty {
    <li class="px-4 py-1.5 text-gray-400">Sin resultados</li>
    }
  </ul>
</div>
