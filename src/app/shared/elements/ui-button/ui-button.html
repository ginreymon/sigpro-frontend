<button [class]="`
    h-8
    px-4
    text-sm
    rounded
    inline-flex
    items-center
    justify-center
    gap-2
    transition-all
    duration-200
    ${disabled ? 'cursor-not-allowed opacity-60' : 'cursor-pointer'}
    border   
    border-gray-300
    font-medium
    ${intents[intent]}
    ${classNames}`
  " [disabled]="disabled" [type]="type" [attr.form]="formId" (click)="clickHandler()">
  <ng-content></ng-content>
</button>
