<button [class]="`
    h-8
    px-3
    text-sm
    rounded
    inline-flex
    items-center
    justify-center
    transition-all
    duration-200
    ${disabled ? 'cursor-not-allowed opacity-60' : 'cursor-pointer'}
    border
    border-gray-300
    font-medium
    ${intents[intent]}
    ${classNames}`
  " [class.gap-2]="hasLabel" [disabled]="disabled" [type]="type" [attr.form]="formId" (click)="clickHandler()">
  <ng-content select="app-ui-icon"></ng-content>
  <span class="btn-label" #labelSpan><ng-content></ng-content></span>
</button>
