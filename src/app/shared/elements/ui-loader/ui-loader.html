@if(showLoader){
    <div class="fixed inset-0 flex flex-col items-center justify-center gap-4 bg-black/40 z-[9999]"
         [attr.role]="message ? 'alertdialog' : null" [attr.aria-busy]="message ? 'true' : null">
        <div class="h-14 w-14 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
        @if(message){
            <p class="text-white text-lg font-medium">{{ message }}</p>
        }
    </div>
}
