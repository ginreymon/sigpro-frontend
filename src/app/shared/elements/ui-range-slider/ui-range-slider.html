<div class="w-full select-none" [class.opacity-50]="disabled">
  <div class="flex justify-between text-xs font-semibold text-gray-700 mb-2">
    <span>{{ formatLabel(startMinutes) }}</span>
    <span class="text-gray-400 font-normal">Duración: {{ durationLabel }}</span>
    <span>{{ formatLabel(endMinutes) }}</span>
  </div>
  <div #track class="relative h-2 bg-gray-200 rounded-full">
    <div
      class="absolute h-2 bg-brand-500 rounded-full"
      [style.left.%]="startPercent"
      [style.width.%]="endPercent - startPercent">
    </div>
    <div
      class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 h-5 w-5 bg-white border-2 border-brand-500 rounded-full shadow"
      [class.cursor-grab]="!disabled"
      [class.active:cursor-grabbing]="!disabled"
      [style.left.%]="startPercent"
      (mousedown)="startDrag('start', $event)"
      (touchstart)="startDrag('start', $event)">
    </div>
    <div
      class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 h-5 w-5 bg-white border-2 border-brand-500 rounded-full shadow"
      [class.cursor-grab]="!disabled"
      [class.active:cursor-grabbing]="!disabled"
      [style.left.%]="endPercent"
      (mousedown)="startDrag('end', $event)"
      (touchstart)="startDrag('end', $event)">
    </div>
  </div>
  <div class="flex justify-between text-[11px] text-gray-400 mt-2">
    <span>Inicio turno: {{ formatLabel(0) }}</span>
    <span>Fin turno: {{ formatLabel(totalMinutes) }}</span>
  </div>
</div>
