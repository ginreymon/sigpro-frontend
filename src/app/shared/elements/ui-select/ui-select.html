<select class="
    h-8
    px-4
    text-sm
    rounded
    border
    border-gray-300
    bg-white
    outline-none
    transition-all
    duration-200
    focus:border-brand-500
    focus:ring-2
    focus:ring-brand-200
  " [(ngModel)]="model" (ngModelChange)="changeHandle($event)">
    @for (item of items; track item; let i = $index) {
    <option [value]="item"> {{ item }} </option>
    }
</select>
