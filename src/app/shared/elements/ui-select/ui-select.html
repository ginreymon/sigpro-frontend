<select [id]="id" [name]="id" [class]="`
    h-8
    px-4
    text-sm
    rounded-md
    border
    bg-white
    outline-none
    transition-all
    duration-200
    focus:ring-2
    ${!value ? 'text-gray-400' : 'text-gray-900'}
    ${invalid
      ? 'border-red-500 focus:border-red-500 focus:ring-red-200'
      : 'border-gray-300 focus:border-brand-500 focus:ring-brand-200'}
    ${className}
  `" [ngModel]="value" (ngModelChange)="changeHandle($event)" (blur)="onTouched()" [disabled]="disabled">

  @if(showDefaultOption){
  <option class="text-gray-400" [ngValue]="null">{{ placeholder || 'Seleccione...' }}</option>
  }

  @for (item of (keyValue && key ? _items : items); track item) {
  <option [ngValue]="keyValue && key ? item[keyValue] : item">
    {{ keyValue && key ? item[key] : item }}
  </option>
  }

</select>
