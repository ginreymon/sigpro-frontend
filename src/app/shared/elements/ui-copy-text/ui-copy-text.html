<button type="button" (click)="copy()" title="Copiar" [attr.aria-label]="'Copiar ' + text()"
  class="inline-flex items-center gap-1.5 text-left cursor-pointer hover:text-brand-700 focus-visible:outline-2 focus-visible:outline-brand">
  <span>{{ text() }}</span>
  <app-ui-icon iconName="copy" [class]="'h-3.5 w-3.5 text-gray-400 shrink-0'"></app-ui-icon>
</button>
