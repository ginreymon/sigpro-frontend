<app-ui-tooltip-fixed [message]="copied() ? 'Copiado' : 'Copiar'" tooltip="top">
  <button type="button" (click)="copy()" (keydown.control.c)="copy()" (keydown.meta.c)="copy()"[attr.aria-label]="'Copiar ' + text()"
    class="inline-flex items-center gap-1.5 rounded text-left cursor-pointer hover:text-brand-700 focus-visible:outline-2 focus-visible:outline-brand">
    <span>{{ text() }}</span>
    @if (showIcon()) {
    <app-ui-icon [iconName]="copied() ? 'check' : 'copy'"
      [class]="'h-3.5 w-3.5 shrink-0 ' + (copied() ? 'text-green-600' : 'text-gray-400')"></app-ui-icon>
    }
  </button>
</app-ui-tooltip-fixed>
