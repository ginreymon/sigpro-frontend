<div [class]="'bg-brand-50 p-6 rounded mt-4 flex gap-4 ' + (align === 'row'
    ? 'flex-col sm:flex-row items-center justify-between'
    : 'flex-col items-start justify-between')">
    @for (line of lines; track line.label) {
        <p [class]="'text-sm text-brand-400 ' + (invertStyles ? 'font-bold text-primary' : 'italic')">
            {{ line.label }}: <strong [class]="invertStyles ? 'italic font-normal' : 'font-bold text-primary'">{{ line.value }}</strong>
        </p>
    }
</div>
