<dl [class]="'mt-4 rounded-md border border-slate-200 px-3 py-2 flex ' + (align === 'row'
    ? 'flex-col sm:flex-row sm:flex-wrap sm:gap-x-8 gap-y-1'
    : 'flex-col divide-y divide-slate-100')">
    @for (line of lines; track line.label) {
        <div [class]="'flex items-baseline justify-between gap-4 ' + (align === 'row' ? '' : 'py-1.5')">
            <dt class="text-xs text-slate-500">{{ line.label }}</dt>
            <dd class="text-sm font-medium text-gray-900">{{ line.value }}</dd>
        </div>
    }
</dl>
