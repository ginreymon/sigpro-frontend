@if (samValue) {
  <div class="relative" (click)="stopProp($event)">
    <span class="font-semibold text-green-600 cursor-pointer select-none" (click)="toggle($event)">{{ samValue }}</span>
    @if (isOpen()) {
      <div [style]="dropdownStyle" class="bg-white rounded-lg shadow-lg border border-slate-200 p-3 space-y-2" (click)="stopProp($event)">
        <p class="text-xs font-semibold text-slate-600">Calcular meta: <span class="text-xs text-green-600">{{ samValue }}</span></p>
        <div class="flex items-center gap-2">
          <label class="text-xs text-slate-500 w-20 shrink-0">Intervalo (min)</label>
          <input type="number" min="0"
            class="w-full text-xs border border-slate-300 rounded px-2 py-1 text-right focus:outline-none focus:ring-1 focus:ring-green-400"
            [value]="intervalo()"
            (input)="intervalo.set(+$any($event.target).value)">
        </div>
        <div class="flex items-center gap-2">
          <label class="text-xs text-slate-500 w-20 shrink-0">Operarios</label>
          <input type="number" min="0.1" step="any"
            class="w-full text-xs border border-slate-300 rounded px-2 py-1 text-right focus:outline-none focus:ring-1 focus:ring-green-400"
            [value]="operarios()"
            (input)="operarios.set(+$any($event.target).value)">
        </div>
        <div class="border-t border-slate-100 pt-2 flex justify-between items-center">
          <span class="text-xs text-slate-500">Meta</span>
          <span class="text-sm font-bold text-green-600">
            {{ targetUnits() ?? '—' }}
            <span class="text-xs font-normal text-slate-400">uds</span>
          </span>
        </div>
      </div>
    }
  </div>
} @else {
  <span class="text-slate-400 text-xs">Sin SAM</span>
}
