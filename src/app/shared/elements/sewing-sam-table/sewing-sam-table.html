<app-data-table
  [paginatedResponse]="paginatedResponse()"
  [columns]="columns"
  (onPagerChange)="pagerHandler($event)"
  (onSearch)="searchHandler($event)">

  <ng-template appTableTemplate="samTemplate" let-row>
    @if (row.sam_value) {
      <span class="font-semibold text-green-600">{{ row.sam_value }}</span>
    } @else {
      <span class="text-slate-400 text-xs">Sin SAM</span>
    }
  </ng-template>

</app-data-table>
