<div class="flex flex-col gap-2">
    @for (step of value; track $index) {
    <div class="flex items-center gap-2">

        <span
            class="shrink-0 w-6 h-8 flex items-center justify-center text-xs font-semibold text-brand-600 bg-brand-50 rounded">
            {{ $index + 1 }}
        </span>

        <input [id]="id + '_description_' + $index" [name]="id + '_description_' + $index"
            [value]="step.description" [placeholder]="descriptionPlaceholder" [disabled]="disabled"
            (input)="updateDescription($index, $event)" (blur)="onTouched()"
            class="w-full px-4 h-8 text-sm rounded border outline-none transition-all duration-200 focus:ring-2 border-gray-300 focus:border-brand-500 focus:ring-brand-200" />

        <input [id]="id + '_time_' + $index" [name]="id + '_time_' + $index" type="number" step="any"
            [value]="step.standard_time" [placeholder]="timePlaceholder" [disabled]="disabled"
            (input)="updateStandardTime($index, $event)" (blur)="onTouched()"
            class="w-28 shrink-0 px-3 h-8 text-sm rounded border outline-none transition-all duration-200 focus:ring-2 border-gray-300 focus:border-brand-500 focus:ring-brand-200" />

        <button type="button" [disabled]="disabled || value.length <= minRows" (click)="removeRow($index)"
            class="shrink-0 w-7 h-8 rounded border border-gray-300 text-brand-400 hover:bg-brand-50 disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center cursor-pointer">
            <app-ui-icon [iconName]="'trash'" [class]="'w-3 h-3'"></app-ui-icon>
        </button>

    </div>
    }

    <button type="button" [disabled]="disabled" (click)="addRow()"
        class="self-start inline-flex items-center gap-2 h-8 px-3 text-sm rounded border border-dashed border-brand-300 text-brand-600 hover:bg-brand-50 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer">
        <app-ui-icon [iconName]="'circlePlus'" [class]="'w-4 h-4'"></app-ui-icon>
        {{ addLabel }}
    </button>
</div>
