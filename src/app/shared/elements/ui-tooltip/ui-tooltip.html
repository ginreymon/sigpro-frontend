<div class="relative inline-block group">
    <ng-content></ng-content>
    @if (message && !escape) {
    <div [class]="`absolute z-50 hidden group-hover:block bg-gray-900 text-white text-xs
           px-2 py-1 rounded-md shadow-lg whitespace-nowrap transition-all duration-200 ${tooltipPosition}`">
        {{ message }}
    </div>
    }
    @if (message && escape && isHovered) {
    <div [ngStyle]="fixedStyle" class="bg-gray-900 text-white text-xs px-2 py-1 rounded-md shadow-lg whitespace-nowrap">
        {{ message }}
    </div>
    }
</div>
