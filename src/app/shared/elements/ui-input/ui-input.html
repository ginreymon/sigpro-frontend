<input [id]="id" [name]="id"
    [class]="`w-full h-8 px-4 gap-2 rounded border text-sm outline-none transition-all duration-200 focus:ring-2 ${invalid?'border-red-500 focus:border-red-500 focus:ring-red-200':'border-gray-300 focus:border-brand-500 focus:ring-brand-200'} ${className}`"
    [placeholder]="placeholder" [value]="value" [type]="type" [disabled]="disabled" (input)="handleInput($event)"
    (blur)="onTouched()" />
