<!-- Trigger input -->
<button
  type="button"
  (click)="open()"
  [class]="'h-8 w-full px-3 text-sm rounded border outline-none transition-all duration-200 flex items-center gap-2 text-left '
    + (invalid ? 'border-red-500 ' : 'border-gray-300 hover:border-brand-400 ')
    + (disabled ? 'cursor-not-allowed opacity-60 bg-gray-50 ' : 'cursor-pointer bg-white ')
    + (displayLabel() ? 'text-gray-900 ' : 'text-gray-400 ')"
  [disabled]="disabled">
  <app-ui-icon [iconName]="'clock'" [class]="'w-4 h-4 shrink-0 text-gray-400'"></app-ui-icon>
  <span class="truncate">{{ displayLabel() || placeholder || 'Seleccionar hora' }}</span>
</button>

<!-- Clock modal -->
@if(isOpen()) {
<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
  (click)="close()">

  <div
    class="bg-white rounded-xl shadow-2xl p-5 w-80 select-none"
    (click)="stopPropagation($event)">

    <!-- Title -->
    <div class="text-sm font-semibold text-gray-700 text-center mb-3">{{ title }}</div>

    <!-- Digital readout + AM/PM selector -->
    <div class="flex items-center justify-center gap-3 mb-3">
      <div class="flex items-center gap-1">
        <button
          type="button"
          class="px-3 py-1 text-3xl font-bold rounded-lg transition-colors cursor-pointer"
          [class]="clockMode() === 'hour' ? 'bg-brand-100 text-brand-700' : 'text-gray-700 hover:bg-gray-100'"
          (click)="selectClockMode('hour')">
          {{ hour12().toString().padStart(2, '0') }}
        </button>
        <span class="text-3xl font-bold text-gray-400">:</span>
        <button
          type="button"
          class="px-3 py-1 text-3xl font-bold rounded-lg transition-colors cursor-pointer"
          [class]="clockMode() === 'minute' ? 'bg-brand-100 text-brand-700' : 'text-gray-700 hover:bg-gray-100'"
          (click)="selectClockMode('minute')">
          {{ temp().minute.toString().padStart(2, '0') }}
        </button>
      </div>

      <div class="flex flex-col rounded-lg border border-gray-300 overflow-hidden">
        <button
          type="button"
          class="px-2 py-1 text-xs font-semibold transition-colors cursor-pointer"
          [class]="period() === 'AM' ? 'bg-brand-500 text-white' : 'text-gray-600 hover:bg-gray-100'"
          (click)="setPeriod('AM')">
          AM
        </button>
        <button
          type="button"
          class="px-2 py-1 text-xs font-semibold transition-colors cursor-pointer border-t border-gray-300"
          [class]="period() === 'PM' ? 'bg-brand-500 text-white' : 'text-gray-600 hover:bg-gray-100'"
          (click)="setPeriod('PM')">
          PM
        </button>
      </div>
    </div>

    <!-- Analog clock face -->
    <div class="flex justify-center mb-1">
      <div
        #wheel
        class="relative w-[240px] h-[240px] rounded-full bg-gray-50 border border-gray-200 cursor-pointer"
        (click)="onWheelClick($event, wheel)">

        <!-- Center pin -->
        <div class="absolute w-2 h-2 rounded-full bg-brand-500 -translate-x-1/2 -translate-y-1/2" style="left:120px; top:120px;"></div>

        <!-- Hand -->
        <div
          class="absolute left-1/2 top-1/2 origin-bottom bg-brand-400 pointer-events-none"
          style="width:2px;"
          [style.height.px]="92"
          [style.transform]="'translateX(-50%) translateY(-100%) rotate(' + pointerAngle() + 'deg)'">
        </div>

        <!-- Thumb at hand tip: plain white dot when not resting on a labeled number -->
        <div
          class="absolute w-7 h-7 rounded-full bg-brand-500 pointer-events-none flex items-center justify-center"
          [style.left.px]="thumbPosition().left"
          [style.top.px]="thumbPosition().top">
          @if(!pointerOnMark()) {
            <span class="w-2 h-2 rounded-full bg-white"></span>
          }
        </div>

        <!-- Marks -->
        @for(mark of marks(); track mark.value) {
          <div
            class="absolute w-9 h-9 flex items-center justify-center pointer-events-none"
            [style.left.px]="markStyle(mark.angleDeg).left"
            [style.top.px]="markStyle(mark.angleDeg).top">
            <span
              [class]="'text-sm font-medium rounded-full w-9 h-9 flex items-center justify-center '
                + (isMarkSelected(mark) ? 'text-white ' : 'text-gray-700 ')">
              {{ mark.label }}
            </span>
          </div>
        }
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-gray-300">
      <app-ui-button [intent]="'cancel'" (onClick)="close()">Cancelar</app-ui-button>
      <app-ui-button [intent]="'accept'" (onClick)="accept()">Aceptar</app-ui-button>
    </div>

  </div>
</div>
}
