<app-shift-cycles-shell [page]="this">
  <ng-container extraContent>
    @if(config.showStampingRecord){
    <app-pending-records-bar
        [records]="manualStampingRecordsStore.records()"
        [forceHidden]="stampingBatchHidesBar()"
        (onSave)="onStampingSaveAllPending()"
        (onDiscard)="manualStampingRecordsStore.clear()">
    </app-pending-records-bar>
    } @else {
    <app-pending-records-bar
        [records]="manualRecordsStore.records()"
        [forceHidden]="batchHidesBar()"
        (onSave)="onSaveAllPending()"
        (onDiscard)="manualRecordsStore.clear()">
    </app-pending-records-bar>
    }
  </ng-container>

  <ng-container quantityModal>
    <app-quantity-duration-modal [selectedSKU]="selectedSKU()" [enable]="inWindow() || finalizeDay()" (onSave)="saveSKU($event)"></app-quantity-duration-modal>
  </ng-container>

  <ng-container stampingWidget>
    <app-stamping-record-manual
        [class.hidden]="!!shiftModals.activeModal() || qms.visible()"
        [visible]="shiftModals.stampingRecordVisible()"
        [inWindow]="inWindow()"
        (onClose)="shiftModals.closeStampingRecord()"
        (onSave)="saveStamping($event)"
    ></app-stamping-record-manual>
  </ng-container>

  <ng-container extraModals>
    <app-duration-schedule-modal
        [visible]="scheduleModalVisible()"
        [enable]="inWindow() || finalizeDay()"
        (onNext)="onScheduleNext($event)"
        (onCancel)="onScheduleCancel()">
    </app-duration-schedule-modal>

    <app-pending-records-review-modal
        [visible]="reviewModalVisible()"
        [records]="manualRecordsStore.records()"
        [schedule]="pendingSchedule()"
        [variant]="'production'"
        (onConfirm)="onReviewConfirm()"
        (onCancel)="onReviewCancel()"
        (onRemove)="manualRecordsStore.removeAt($event)">
    </app-pending-records-review-modal>

    @if(config.showStampingRecord){
    <app-duration-schedule-modal
        [visible]="stampingScheduleModalVisible()"
        [enable]="inWindow() || finalizeDay()"
        (onNext)="onStampingScheduleNext($event)"
        (onCancel)="onStampingScheduleCancel()">
    </app-duration-schedule-modal>

    <app-pending-records-review-modal
        [visible]="stampingReviewModalVisible()"
        [records]="manualStampingRecordsStore.records()"
        [schedule]="stampingPendingSchedule()"
        [variant]="'stamping'"
        [additionalTimeMinutes]="additionalTimeMinutes()"
        (onConfirm)="onStampingReviewConfirm()"
        (onCancel)="onStampingReviewCancel()"
        (onRemove)="manualStampingRecordsStore.removeAt($event)">
    </app-pending-records-review-modal>
    }
  </ng-container>
</app-shift-cycles-shell>
