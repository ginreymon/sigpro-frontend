<app-shift-cycles-shell [page]="this">
  <ng-container quantityModal>
    <app-quantity-modal [selectedSKU]="selectedSKU()" [enable]="inWindow() || finalizeDay()" (onSave)="saveSKU($event)"></app-quantity-modal>
  </ng-container>

  <ng-container hourlyWidget>
    <app-shift-hourly-record
        [class.hidden]="!!shiftModals.activeModal() || qms.visible()"
        [enabled]="config.showHourlyRecord && currentSession() !== null"
        [activityId]="currentSession()?.active_activity?.id"
        [activeBreak]="currentSession()?.active_activity?.active_break ?? null"
        [currentSession]="currentSession()"
        [lastProductionRecord]="currentSession()?.active_activity?.last_production_record"
        (onFinalize)="refreshSession()"
        (onActivityPaused)="onPauseSaved($event)"
        (inWindowChange)="config.showHourlyRecord && inWindow.set($event)"
    ></app-shift-hourly-record>
  </ng-container>

  <ng-container stampingWidget>
    <app-stamping-record
        [class.hidden]="!!shiftModals.activeModal() || qms.visible()"
        [visible]="shiftModals.stampingRecordVisible()"
        [inWindow]="inWindow() || finalizeDay()"
        (onClose)="shiftModals.closeStampingRecord()"
        (onFinalize)="refreshSession()"
        (onSave)="saveStamping($event)"
    ></app-stamping-record>
  </ng-container>
</app-shift-cycles-shell>
