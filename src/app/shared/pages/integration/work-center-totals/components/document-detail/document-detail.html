@if (showCommonSections()) {
  <app-document-section [title]="targetName()" dotClass="bg-brand-500">
    <app-document-stat label="Completada" [value]="document().total_completed" tone="text-green-600"></app-document-stat>
    <app-document-stat label="Rechazada" [value]="document().total_rejected" tone="text-amber-500"></app-document-stat>
    <app-document-stat label="Bajas" [value]="document().total_scrap" tone="text-red-500"></app-document-stat>
    <app-document-stat label="Total" [value]="document().total_recorded" tone="font-bold text-gray-800"></app-document-stat>
  </app-document-section>

  <app-document-section [title]="sourceName()" dotClass="bg-slate-400">
    <app-document-stat label="Planeada" [value]="document().erp_planned_quantity ?? '—'"></app-document-stat>
    <app-document-stat label="Ordenada" [value]="document().erp_ordered_quantity ?? '—'"></app-document-stat>
    <app-document-stat label="Completada" [value]="document().erp_completed_quantity ?? '—'"></app-document-stat>
    <app-document-stat label="Diferencia" [value]="document().erp_sigpro_difference ?? '—'"></app-document-stat>
  </app-document-section>

  <app-document-section title="Registros">
    <app-document-stat label="Número de registros" [value]="document().total_records"></app-document-stat>
    <app-document-stat label="Código de operación" [value]="document().operation_number ?? '—'"></app-document-stat>
    <app-document-stat label="Registros por pieza" [value]="document().recorded_quantity_per_piece ?? '—'"></app-document-stat>
    <app-document-stat label="Segundos por unidad"
      [value]="document().seconds_by_unit != null ? ((document().seconds_by_unit | number: '1.0-2') + ' s') : '—'"></app-document-stat>
  </app-document-section>
}

@if (originDetail(); as detail) {
  <ng-container *ngComponentOutlet="detail.component; inputs: detailInputs()"></ng-container>
}
