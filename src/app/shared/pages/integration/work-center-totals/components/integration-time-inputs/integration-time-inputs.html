@if (visible()) {
  <section class="flex flex-col gap-2 rounded-md border border-slate-200 p-3">
    <p class="text-xs text-slate-500 mb-2">
      Tiempo · {{ units() }} und seleccionadas × {{ secondsPerUnit() | number: '1.0-2' }} s por unidad
    </p>
    <div class="flex items-center gap-3 max-w-xs w-full mx-auto">
      <app-ui-hour-input [formControl]="hoursControl" [control]="hoursControl" [id]="'integration-hours-' + uid" title="Horas" [min]="0" [max]="99"></app-ui-hour-input>
      <span class="text-3xl font-bold text-slate-400">:</span>
      <app-ui-hour-input [formControl]="minutesControl" [control]="minutesControl" [id]="'integration-minutes-' + uid" title="Minutos" [min]="0" [max]="59"></app-ui-hour-input>
    </div>
  </section>
}
