<div class="flex flex-col gap-2">

  <app-integration-erp-status [document]="document()"></app-integration-erp-status>

  <app-integration-quantity-input [max]="toIntegrateQty()" [initial]="typedUnits()"
    (quantityChange)="applyQuantity($event)"></app-integration-quantity-input>

  @if (!sams().length) {
    <p class="text-sm text-slate-500">Sin registros de estampación</p>
  }

  <app-integration-time-inputs [units]="selectedUnits()" [secondsPerUnit]="secondsPerUnit()"
    [selection]="selectedSamIds()" [visible]="selectedSamIds().length > 0" [submitted]="submitted()"
    (summary)="selectionSummary.emit($event)"></app-integration-time-inputs>

</div>
