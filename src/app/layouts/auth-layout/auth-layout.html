<div class="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-display">

    <header class="w-full px-8 py-6 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-brand rounded flex items-center justify-center">
                <span class="text-white font-bold text-xl">S</span>
            </div>
            <span class="text-lg sm:text-xl font-bold tracking-tight text-brand dark:text-white truncate sm:whitespace-normal">
                SIGPRO<span class="font-light opacity-70 ml-2 hidden sm:inline">SISTEMA INTEGRAL DE GESTIÓN DE PRODUCCIÓN</span>
            </span>
        </div>
    </header>

    <main class="grow flex items-center justify-center px-4 sm:px-6 py-8 lg:py-0 relative">
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="absolute top-1/4 -left-20 w-60 h-60 sm:w-96 sm:h-96 bg-brand-50 dark:bg-brand-900/20 rounded-full blur-3xl">
            </div>
            <div class="absolute bottom-1/4 -right-20 w-60 h-60 sm:w-96 sm:h-96 bg-brand-50 dark:bg-brand-900/30 rounded-full blur-3xl">
            </div>
        </div>

        <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-6 lg:gap-12 items-center relative z-10">

            <div class="flex flex-col items-center text-center pt-2 lg:items-start lg:text-left lg:self-start lg:pt-8">
                <div
                    class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-50 dark:bg-brand-900/40 text-brand dark:text-brand-300 text-xs font-semibold uppercase tracking-wider mb-4 lg:mb-6 w-fit">
                    <span class="relative flex h-2 w-2">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-brand"></span>
                    </span>
                    Ingreso a la aplicación
                </div>

                <h1 class="text-3xl lg:text-5xl font-extrabold text-brand mb-2 lg:mb-4 leading-tight">
                    Bienvenido a<br>SIGPRO<br>
                    <app-animated-text class="text-5xl lg:text-7xl font-klik text-black dark:text-white uppercase" text="REYMON" />
                </h1>

            </div>

            <div class="flex justify-center items-center">
                <ng-content></ng-content>
            </div>

        </div>
    </main>

    <footer class="w-full py-4 sm:py-6 px-4 sm:px-8 border-t border-slate-200 dark:border-slate-800">
        <div class="max-w-6xl mx-auto flex justify-center sm:justify-end">
            <p class="text-xs text-slate-400">© {{ currentYear }} SIGPRO</p>
        </div>
    </footer>

</div>
