@if (showMenu) {
  <div class="fixed inset-0 z-40" (click)="closeMenu()"></div>
}

<aside [class]="'h-[calc(100vh-4rem)] w-64 bg-gray-900 text-gray-100 flex flex-col fixed top-16 left-0 transform z-50 -translate-x-full '+ (menuReady?'transition-transform duration-500 ease-out ':'')+ (showMenu ? 'translate-x-0' : '')">
    <nav class="menu-scroll flex-1 min-h-0 overflow-y-auto px-4 py-4 space-y-2">
        @for(mod of modules; track mod){
        <div class="group">
            <a [class]="'flex items-center justify-between px-4 py-2 rounded-lg hover:bg-gray-800 transition cursor-pointer '+ (mod.state?'bg-gray-800':'')" (click)="toggleModule(mod)">
                <span>{{ mod.name | titlecase }}</span>
                <span class="transition-transform group-hover:rotate-90 duration-300">></span>
            </a>
            <div [class]="'grid ml-4 mt-1 transition-[grid-template-rows] duration-300 ease-in-out ' +(mod.state?'grid-rows-[1fr] opacity-100':'grid-rows-[0fr] opacity-0')">
            <div class="overflow-hidden space-y-1">
            @for(op of mod.options; track op){
                @if(op.visible){
                <a class="block px-4 py-2 pl-6 text-sm text-gray-300 rounded-md transition-all duration-200 hover:bg-gray-800 hover:text-white cursor-pointer" (click)="navigate(mod,op)">
                    {{ op.name | titlecase }}
                </a>
                }
            }
            </div>
            </div>
        </div>
        }
    </nav>
</aside>
