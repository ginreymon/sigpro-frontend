<div class="flex items-center justify-center w-full h-full font-display bg-slate-50 dark:bg-slate-950 rounded-lg border border-slate-200 dark:border-slate-700">
    <div class="relative flex flex-col items-center justify-center gap-6 py-14 px-10 max-w-lg text-center min-h-64">
        <div class="relative z-10 flex flex-col items-center gap-5">
            <div class="relative w-20 h-20 unplanned-shift-message-float">
                <div class="absolute inset-0 rounded-full border-2 border-dashed border-brand-100 dark:border-brand-900/40 animate-spin" style="animation-duration: 20s;"></div>
                <div class="absolute inset-2 rounded-full bg-brand-50 dark:bg-brand-900/30 flex items-center justify-center">
                    <app-ui-icon [iconName]="icon" [class]="'w-8 h-8 text-brand dark:text-brand-300'"></app-ui-icon>
                </div>
            </div>
            <div class="flex flex-col items-center gap-3">
                <h3 class="text-3xl md:text-4xl font-semibold tracking-tight text-slate-900 dark:text-white text-center">{{ title }}</h3>
                <p class="text-base text-slate-500 dark:text-slate-400 leading-relaxed max-w-sm text-center">{{ description }}</p>
            </div>
            <ng-content></ng-content>
        </div>
    </div>
</div>
