<div class="flex items-center justify-center">
    <div class="relative flex flex-col items-center justify-center gap-6 py-14 px-10 max-w-lg text-center min-h-64">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none"
            class="absolute w-108 h-108 opacity-15 pointer-events-none select-none">
            <rect x="8" y="18" width="64" height="54" rx="8" class="fill-brand-200" />
            <rect x="8" y="18" width="64" height="16" rx="8" class="fill-brand-300" />
            <rect x="8" y="26" width="64" height="8" class="fill-brand-300" />
            <rect x="22" y="10" width="6" height="14" rx="3" class="fill-brand-400" />
            <rect x="52" y="10" width="6" height="14" rx="3" class="fill-brand-400" />

            <line x1="40" y1="53" x2="35" y2="45" stroke-width="2" stroke-linecap="round" class="stroke-brand-300" />
            <line x1="40" y1="53" x2="47" y2="47" stroke-width="2" stroke-linecap="round" class="stroke-brand-300" />
            <circle cx="40" cy="53" r="1.5" class="fill-brand-400" />
            <circle cx="24" cy="42" r="2" class="fill-brand-100" />
            <circle cx="32" cy="42" r="2" class="fill-brand-100" />
            <circle cx="24" cy="50" r="2" class="fill-brand-100" />
            <circle cx="32" cy="50" r="2" class="fill-brand-100" />
        </svg>
        <div class="relative z-10 flex flex-col items-center gap-5">
            <div class="flex flex-col gap-3">
                <h3 class="text-2xl font-bold text-gray-700">{{ title }}</h3>
                <p class="text-base text-gray-500 leading-relaxed max-w-sm">{{ description }}</p>
            </div>
            <ng-content></ng-content>
        </div>
    </div>
</div>
