<header class="fixed top-0 left-0 right-0 z-50 bg-brand-400 shadow-md max-h-[calc(4rem)] flex flex-row items-center justify-between w-full">
  <div class="flex items-center justify-between px-4 py-3 w-full">
   
    <div class="flex items-center gap-3">
      
      <button type="button" class="inline-flex items-center justify-center w-10 h-10 rounded-full ring-2 ring-white/70 hover:ring-white transition-all duration-200 cursor-pointer" (click)="toggleMenu()">
        @if(showMenu){         
          <app-ui-icon [iconName]="'close'" [class]="'w-5 h-5 text-white'"></app-ui-icon>
        }@else {
          <app-ui-icon [iconName]="'menu'" [class]="'w-5 h-5 text-white'"></app-ui-icon>
        } 
      </button>

      <a class="flex flex-col sm:flex-row sm:items-center text-white font-semibold tracking-wide cursor-pointer" routerLink="/">
        <span class="text-lg sm:text-base mr-1">SIGPRO</span>
        <span class="text-sm sm:text-base">
          {{ getAppLocation() | titlecase }}
        </span>
      </a>

    </div>
   
    <div class="relative group">
      
      <button class="inline-flex items-center gap-2 px-4 py-2 text-white rounded-md transition-all duration-200 hover:bg-brand-600 hover:text-white cursor-pointer" (click)="toggleShowUserMenu()">
        <app-ui-icon [iconName]="'user'" [class]="'w-5 h-5'"></app-ui-icon>  
        <span class="transition-transform group-hover:rotate-180">∧</span>
      </button>

    
      <div [class]="`absolute right-0 mt-2 w-44 z-50 bg-gray-100 rounded-md shadow-lg transition-all duration-150 ${showUserMenu()?'opacity-100 scale-100':'opacity-0 scale-95'}`">       
        @if(showUserMenu()){
        <ul class="p-1 text-sm text-body font-medium">
          
          <app-header-menu-item>            
            <app-ui-icon [iconName]="'user'" [class]="'w-5 h-5'"></app-ui-icon>  
            <span class="text-sm font-medium ml-2">{{ getUser() }}</span>
          </app-header-menu-item>

          <app-header-menu-item>            
            <app-ui-icon [iconName]="'settings'" [class]="'w-5 h-5'"></app-ui-icon>  
            <span class="text-sm font-medium ml-2">Configuración</span>
          </app-header-menu-item>

          <app-header-menu-item (itemClick)="logout()">
            <app-ui-icon [iconName]="'logout'" [class]="'w-5 h-5'"></app-ui-icon>           
            <span class="text-sm font-medium ml-2">Cerrar sesión</span>
          </app-header-menu-item>
          
        </ul>
        }
      </div>
    </div>

  </div>
</header>
