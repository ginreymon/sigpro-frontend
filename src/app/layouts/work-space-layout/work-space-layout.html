<div class="flex flex-col lg:flex-row lg:justify-between flex-1 w-full min-h-[calc(100vh-4rem)] sm:w-auto sm:min-h-0 lg:min-h-full lg:h-full gap-2 px-3 pt-3 pb-3 sm:px-0 sm:pt-0 sm:pb-0">

    @if(showSideContent() && !isLargeScreen()){
    <div class="flex sm:inline-flex w-full sm:w-fit items-center gap-1 p-1 bg-slate-100 rounded-lg">
        <button type="button" (click)="activeTab.set('main')"
            [class]="'flex-1 sm:flex-none px-4 py-2.5 sm:py-1.5 text-sm font-medium rounded-md transition-all duration-200 cursor-pointer ' + (activeTab() === 'main' ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-500 hover:text-slate-700')">
            {{ mainTabLabel }}
        </button>
        <button type="button" (click)="activeTab.set('aside')"
            [class]="'flex-1 sm:flex-none px-4 py-2.5 sm:py-1.5 text-sm font-medium rounded-md transition-all duration-200 cursor-pointer ' + (activeTab() === 'aside' ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-500 hover:text-slate-700')">
            {{ asideTabLabel }}
        </button>
    </div>
    }

    @if(showSideContent()){

    <div [class]="'shrink-0 flex flex-col lg:min-h-full order-2 ' + (!isLargeScreen() && activeTab() !== 'aside' ? 'hidden' : '')" [style.minWidth]="showSideContent() && isLargeScreen() ? 'calc(100vw/3)' : null">
        <div class="sm:bg-white sm:border sm:border-slate-200 rounded-none sm:rounded-lg shadow-none sm:shadow-md p-0 sm:p-4 lg:p-6 lg:flex-1 lg:overflow-auto">

            @if(isLoading()){
            <div class="space-y-4">

                <div class="h-6 skeleton rounded w-2/3"></div>

                <div class="h-4 skeleton rounded w-full"></div>
                <div class="h-4 skeleton rounded w-5/6"></div>

                <div class="h-32 skeleton rounded-lg"></div>

                <div class="h-4 skeleton rounded w-full"></div>
                <div class="h-4 skeleton rounded w-3/4"></div>

            </div>

            }@else{
            <ng-content select="[aside-content]"></ng-content>
            }

        </div>
    </div>
    }

    <div [class]="'flex flex-col flex-1 order-1 ' + (showSideContent() && !isLargeScreen() && activeTab() !== 'main' ? 'hidden' : '')" [style.maxWidth]="showSideContent() && isLargeScreen() ? 'calc(200vw/3 - 4rem)' : null">

        @if(showHeader() && headerVisible){
        <div class="sm:bg-white sm:border sm:border-slate-200 rounded-none sm:rounded-lg shadow-none sm:shadow-md p-3 sm:p-4 lg:p-6 mb-2 relative">

            @if(isLoading()){
            <div class="space-y-4">
                <div class="h-7 skeleton rounded w-1/3 mb-2"></div>
                <div class="h-4 skeleton rounded w-2/3"></div>
            </div>
            }@else {
            <div class="absolute top-3 right-3 sm:top-6 sm:right-6">
                <app-ui-close-button (onClose)="toggleHeader()"></app-ui-close-button>
            </div>
            <h2 class="text-2xl font-semibold text-slate-900 mb-2"> {{ option.title | titlecase }} </h2>
            <p class="text-slate-500 text-sm"> {{ option.description }} </p>
            }

        </div>
        }

        <div [class]="`flex-1 min-h-0 ${showHeader() && headerVisible?'mt-2':''}`">
            <div [class]="`h-full overflow-auto max-h-full ${showBackground()?'bg-white sm:border sm:border-slate-200 rounded-none sm:rounded-lg shadow-none sm:shadow-md p-0 sm:p-4 lg:p-6':''}`">

                @if(isLoading()){
                <div class="space-y-4">
                    <div class="h-4 skeleton rounded w-full"></div>
                    <div class="h-4 skeleton rounded w-5/6"></div>
                    <div class="h-4 skeleton rounded w-4/6"></div>
                    <div class="h-40 skeleton rounded"></div>
                </div>
                }@else {
                <ng-content select="[main-content]"></ng-content>
                }

            </div>
        </div>

    </div>

</div>
