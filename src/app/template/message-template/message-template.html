<div class="flex flex-col h-full w-full items-center justify-center text-center font-display relative overflow-hidden bg-slate-50 dark:bg-slate-950 rounded-lg">

  <div class="absolute -top-40 -left-24 w-125 h-125 rounded-full bg-brand-50 dark:bg-brand-900/20 blur-3xl opacity-40 pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-24 w-100 h-100 rounded-full bg-brand-100 dark:bg-brand-900/30 blur-3xl opacity-30 pointer-events-none"></div>

  <div class="relative z-10 flex flex-col items-center max-w-2xl mx-auto px-6 py-10">

    @if (code) {
    <span class="absolute inset-0 flex items-center justify-center text-[200px] md:text-[280px] font-black text-brand/5 select-none pointer-events-none leading-none">
      {{ code }}
    </span>
    }

    <div class="relative z-10 w-40 h-40 md:w-48 md:h-48 mb-8 message-template-float">
      <div class="absolute inset-0 rounded-full border-8 border-dashed border-brand-100 dark:border-brand-900/40 message-template-spin"></div>
      <div class="absolute inset-6 rounded-full bg-white dark:bg-slate-800 shadow-xl border border-slate-200 dark:border-slate-700 flex items-center justify-center">
        <app-ui-icon [iconName]="illustrationIcon" [class]="'w-14 h-14 text-brand'"></app-ui-icon>
      </div>
      @if (badgeLabel) {
      <div class="absolute -bottom-2 right-2 bg-brand text-white px-3 py-1 rounded-full text-[11px] font-bold shadow-lg flex items-center gap-1.5 whitespace-nowrap">
        @if (badgeIcon) {
        <app-ui-icon [iconName]="badgeIcon" [class]="'w-3.5 h-3.5'"></app-ui-icon>
        }
        {{ badgeLabel }}
      </div>
      }
    </div>

    <h2 class="relative z-10 text-3xl md:text-5xl font-extrabold tracking-tight text-slate-900 dark:text-white mb-4">{{ title }}</h2>
    <p class="relative z-10 text-base text-slate-500 dark:text-slate-400 leading-relaxed max-w-lg">{{ description }}</p>

  </div>

</div>
