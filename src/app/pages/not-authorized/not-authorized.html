<app-error-page
  code="403"
  pillLabel="Acceso Denegado"
  title="Sin autorización"
  description="No tienes permisos para acceder a esta página. Contacta al administrador si crees que esto es un error."
  errorId="403-UNAUTHORIZED"
  illustrationIcon="lock"
  badgeIcon="fail"
  badgeLabel="Forbidden">

  <div actions class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
    <button (click)="goHome()"
       class="bg-brand hover:bg-brand-hover text-white px-8 py-4 rounded-lg font-bold transition-all hover:-translate-y-1 shadow-lg flex items-center justify-center gap-2">
      <app-ui-icon iconName="house" [class]="'w-4 h-4'"></app-ui-icon>
      Volver al Inicio
    </button>
    <a routerLink="/login"
       class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-brand dark:hover:border-brand px-8 py-4 rounded-lg font-bold transition-all text-slate-700 dark:text-slate-200 flex items-center justify-center gap-2">
      <app-ui-icon iconName="circleRight" [class]="'w-4 h-4'"></app-ui-icon>
      Iniciar Sesión
    </a>
  </div>

</app-error-page>
