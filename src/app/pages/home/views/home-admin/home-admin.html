<!-- relative: contains the absolutely positioned sr-only tables so they do not add a page-level scroll -->
<div class="relative flex flex-col gap-4">
  <app-ui-tabs [tabs]="tabs" [activeKey]="activeTab()" (tabChange)="onTabChange($event)"></app-ui-tabs>

@if (isOpTab()) {
  <app-op-progress-by-module
    title="Avance de OP por módulo"
    [rows]="opProgress().rows"
    [state]="opProgress().state"
    [areaOptions]="opAreaOptions"
    [areaId]="opFilters().areaId"
    [startDate]="opFilters().startDate"
    [endDate]="opFilters().endDate"
    (filtersChange)="onOpFiltersChange($event)">
  </app-op-progress-by-module>
} @else {
  <ng-container *ngComponentOutlet="active().cards" />

  <app-area-daily-charts
    [areaLabel]="active().label"
    [color]="active().color"
    [monthLabel]="monthLabel"
    [rows]="active().rows"
    [state]="active().state">
  </app-area-daily-charts>

  <app-efficiency-radar-chart
    [title]="'Eficiencia por módulo · ' + monthLabel"
    [areaLabel]="active().label"
    [color]="active().color"
    [labels]="moduleLabels()"
    [values]="moduleValues()"
    [target]="appConfig.highEfficiencyLimit"
    targetLabel="Meta de eficiencia"
    [state]="active().state">
  </app-efficiency-radar-chart>
}
</div>
