<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

  <!-- Card 1 -->
  <div class="bg-white border border-gray-200 rounded-lg p-5 flex flex-col gap-3">
    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Eficiencia de planta</span>
    <div class="flex items-stretch border border-gray-200 rounded-lg overflow-hidden text-sm w-full">
      <div class="flex-1 flex flex-col items-center justify-center px-4 py-2 gap-0.5">
        <span class="text-xs font-semibold tracking-widest text-gray-400 uppercase">Eficiencia</span>
        <span [class]="'text-xl font-bold ' + efficiencyColor(plantaModule().efficiency, plantaModule().status)">
          {{ plantaModule().efficiency.toFixed(2) }}%
        </span>
      </div>
      <div class="w-px bg-gray-200"></div>
      <div class="flex-1 flex flex-col items-center justify-center px-4 py-2 gap-0.5">
        <span class="text-xs font-semibold tracking-widest text-gray-400 uppercase">Completadas</span>
        <span [class]="'text-xl font-bold ' + (plantaModule().status === 'ACTIVE' ? 'text-green-600' : 'text-gray-400')">
          {{ plantaModule().total_completed }}
        </span>
      </div>
      <div class="w-px bg-gray-200"></div>
      <div class="flex-1 flex flex-col items-center justify-center px-4 py-2 gap-0.5">
        <span class="text-xs font-semibold tracking-widest text-gray-400 uppercase">Módulos</span>
        <span [class]="'text-xl font-bold ' + (activeModuleCount() > 0 ? 'text-green-600' : 'text-gray-400')">
          {{ activeModuleCount() }}
        </span>
      </div>
    </div>
  </div>

</div>
