<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

  <!-- Card 1 -->
  <div class="bg-white border border-gray-200 rounded-lg p-5 flex flex-col gap-3 hover:shadow-md transition-shadow cursor-pointer" (click)="goToModulePanel()">
    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Eficiencia de planta</span>
    <app-efficiency-summary-bar
      [efficiency]="plantaModule().efficiency"
      [status]="plantaModule().status"
      [completed]="plantaModule().total_completed"
      [activeModules]="activeModuleCount()">
    </app-efficiency-summary-bar>
  </div>

</div>
