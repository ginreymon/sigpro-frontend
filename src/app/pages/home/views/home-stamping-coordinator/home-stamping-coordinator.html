<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

  <app-home-productivity-card
    [label]="plantaModule().status === 'ACTIVE' ? 'Hoy' : 'Último día trabajado'"
    [efficiency]="plantaModule().efficiency"
    [status]="plantaModule().status"
    [completed]="plantaModule().total_completed"
    [activeModules]="plantaModuleCount()"
    [clickable]="true"
    (cardClick)="goToPanel()">
  </app-home-productivity-card>

  <app-home-productivity-card
    [label]="monthLabel()"
    [efficiency]="monthlyEfficiency()"
    [status]="monthlyEfficiency() > 0 ? 'ACTIVE' : 'INACTIVE'"
    [completed]="monthlyCompleted()">
  </app-home-productivity-card>

</div>
