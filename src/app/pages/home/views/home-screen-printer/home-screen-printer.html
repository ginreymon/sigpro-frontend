<app-home-operator-hero [iconName]="'hammer'" [title]="heroTitle()" [description]="heroDescription()" [loading]="heroLoading()">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

    <!-- Day information -->
    <div>
      @if (hasError()) {
      <app-home-state-card class="h-full" [variant]="'error'" [title]="'No se pudo cargar la jornada'"
        [message]="'Actualice la página para intentarlo de nuevo.'"></app-home-state-card>
      } @else if (!isLoading() && !activeSession()) {
      <app-home-state-card class="h-full" [variant]="'empty'" [title]="'Sin jornada activa'"
        [message]="'Inicie una jornada para ver la eficiencia y las metas.'"></app-home-state-card>
      } @else {
      <app-home-stamping-shift-card class="h-full" [loading]="isLoading()" [session]="activeSession()"></app-home-stamping-shift-card>
      }
    </div>

    <!-- Month summary: always shown, independent from the active session -->
    <div>
      <app-home-month-card class="h-full" [service]="productivityService" [moduleId]="activeSession()?.current_module?.id"
        [ready]="!isLoading()" (location)="onLocation($event)"></app-home-month-card>
    </div>

    <!-- Action last -->
    <div class="md:col-span-2 lg:col-span-1">
      <app-home-action-card class="h-full" [loading]="isLoading()" [hasPending]="hasPendingSession()"
        [idleText]="'Comience una nueva orden de estampación de la jornada.'" (action)="onAction()">
      </app-home-action-card>
    </div>

  </div>
</app-home-operator-hero>
