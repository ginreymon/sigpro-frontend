<app-auth-layout>

    <form [formGroup]="requestForm" (ngSubmit)="send()" class="lg:w-1/4 md:w-1/2 bg-white rounded-lg p-8 flex flex-col w-full shadow-md">

        <fieldset [disabled]="isLoading()">

            <h2 class="text-gray-900 text-lg mb-1 font-medium title-font">Recuperar contraseña</h2>

            <app-ui-form-field [controlName]="'username'" [label]="'Usuario'">
                <app-ui-input formControlName="username" [id]="'username'" [placeholder]="'Usuario'" [control]="username"></app-ui-input>
            </app-ui-form-field>

            <app-ui-form-field [controlName]="'idNumber'" [label]="'Número de documento'">
                <app-ui-input formControlName="idNumber" [id]="'idNumber'" [placeholder]="'Cédula'" [control]="idNumber" [type]="'number'"></app-ui-input>
            </app-ui-form-field>

            @if (errorMessage) {
                <app-ui-error-message>{{ errorMessage }}</app-ui-error-message>
            }

            <div class="mb-4 text-right">
                <a routerLink="/login"
                    class="text-sm text-brand-400 hover:text-brand-600 hover:underline transition-all duration-200 cursor-pointer">
                    Iniciar sesión
                </a>
            </div>

        </fieldset>

        <app-form-action-btn [disabled]="isLoading()">
            @if (isLoading()) {
            Enviando...
            } @else {
            Enviar
            }
        </app-form-action-btn>

    </form>

</app-auth-layout>

<app-loader [showLoader]="isLoading()"></app-loader>
