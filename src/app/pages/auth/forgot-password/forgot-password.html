<app-auth-layout>

    <form [formGroup]="requestForm" (ngSubmit)="send()" class="w-full max-w-md bg-white dark:bg-slate-800 rounded-3xl p-8 flex flex-col shadow-2xl border border-slate-200 dark:border-slate-700 mt-6 lg:mt-0">

        <fieldset [disabled]="isLoading()">

            <h2 class="text-gray-900 text-lg mb-4 font-medium title-font">Recuperar contraseña</h2>

            <app-ui-form-field [controlName]="'username'" [label]="'Usuario'">
                <app-ui-input formControlName="username" [id]="'username'" [placeholder]="'Usuario'" [control]="username" [large]="true"></app-ui-input>
            </app-ui-form-field>

            <app-ui-form-field [controlName]="'idNumber'" [label]="'Número de documento'">
                <app-ui-input formControlName="idNumber" [id]="'idNumber'" [placeholder]="'Cédula'" [control]="idNumber" [type]="'number'" [large]="true"></app-ui-input>
            </app-ui-form-field>

            @if (errorMessage) {
                <app-ui-error-message>{{ errorMessage }}</app-ui-error-message>
            }

            <div class="mb-4 text-right">
                <a routerLink="/login"
                    class="text-sm text-brand-400 hover:text-brand-600 hover:underline transition-all duration-200 cursor-pointer">
                    Iniciar sesión
                </a>
            </div>

        </fieldset>

        <app-form-action-btn [disabled]="isLoading()">
            <app-ui-icon iconName="arrowRight" [class]="'w-5 h-5'"></app-ui-icon>
            {{isLoading()?'Enviando...':'Enviar'}}
        </app-form-action-btn>

    </form>

</app-auth-layout>
