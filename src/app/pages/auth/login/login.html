<app-auth-layout>

    <form [formGroup]="loginForm" (ngSubmit)="login()"
        class="w-full max-w-md bg-white dark:bg-slate-800 rounded-3xl p-8 flex flex-col shadow-2xl border border-slate-200 dark:border-slate-700 mt-6 lg:mt-0">

        <fieldset [disabled]="isLoading()">

            <h2 class="text-gray-900 dark:text-slate-100 text-lg mb-4 font-medium title-font">Iniciar sesión</h2>

            <app-ui-form-field [controlName]="'username'" [label]="'Usuario'">
                <app-ui-input formControlName="username" [id]="'username'" [placeholder]="'Usuario'" [control]="username" [large]="true"></app-ui-input>
            </app-ui-form-field>

            <app-ui-form-field [controlName]="'password'" [label]="'Contraseña'">
                <div class="relative">
                    <app-ui-input formControlName="password" [id]="'password'" [placeholder]="'Contraseña'" [control]="password" [type]="showPassword ? 'text' : 'password'" [large]="true"></app-ui-input>
                    <app-ui-toggle-password-btn (showPasswordChange)="setShowPassword($event)" [showPassword]="showPassword" [invalid]="!!(password?.invalid && password?.touched)" [large]="true"></app-ui-toggle-password-btn>
                </div>
            </app-ui-form-field>

            @if (errorMessage()) {
                <app-ui-error-message>{{ errorMessage() }}</app-ui-error-message>
            }

            <div class="mb-4 text-right">
                <a routerLink="/forgot-password"
                    class="text-sm text-brand-400 hover:text-brand-600 hover:underline transition-all duration-200 cursor-pointer">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>

        </fieldset>

        <app-ui-form-action-btn [disabled]="isLoading()">
            <app-ui-icon iconName="circleRight" [class]="'w-5 h-5'"></app-ui-icon>
            {{isLoading()?'Ingresando...':'Ingresar'}}
        </app-ui-form-action-btn>

    </form>

</app-auth-layout>
