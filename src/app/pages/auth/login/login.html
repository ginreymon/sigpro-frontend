<app-auth-layout>

    <form [formGroup]="loginForm" (ngSubmit)="login()"
        class="lg:w-1/4 md:w-1/2 bg-white rounded-lg p-8 flex flex-col w-full shadow-md">

        <fieldset [disabled]="isLoading()">

            <h2 class="text-gray-900 text-lg mb-1 font-medium title-font">Iniciar sesión</h2>

            <app-ui-form-field [controlName]="'username'" [label]="'Usuario'">
                <app-ui-input formControlName="username" [id]="'username'" [placeholder]="'Usuario'" [control]="username"></app-ui-input>
            </app-ui-form-field>

            <app-ui-form-field [controlName]="'password'" [label]="'Contraseña'">
                <div class="relative">
                    <app-ui-input formControlName="password" [id]="'password'" [placeholder]="'Contraseña'" [control]="password" [type]="showPassword ? 'text' : 'password'"></app-ui-input>
                    <app-toggle-password-btn (showPasswordChange)="setShowPassword($event)" [showPassword]="showPassword" [invalid]="!!(password?.invalid && password?.touched)"></app-toggle-password-btn>
                </div>
            </app-ui-form-field>

            @if (errorMessage) {
                <app-ui-error-message>{{ errorMessage }}</app-ui-error-message>
            }

            <div class="mb-4 text-right">
                <a routerLink="/forgot-password"
                    class="text-sm text-brand-400 hover:text-brand-600 hover:underline transition-all duration-200 cursor-pointer">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>

        </fieldset>

        <app-form-action-btn [disabled]="isLoading()">
            @if (isLoading()) {
            Ingresando...
            } @else {
            Ingresar
            }
        </app-form-action-btn>

    </form>

</app-auth-layout>

<app-loader [showLoader]="isLoading()"></app-loader>
