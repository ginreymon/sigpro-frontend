<!doctype html>
<html lang="es" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <title>SIGPRO</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Hanken Grotesk is served from this origin and preloaded, so it is requested with the HTML instead of after the CSS. -->
  <link rel="preload" href="fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Hanken Grotesk';
      font-style: normal;
      font-display: swap;
      font-weight: 100 900;
      src: url('/fonts/hanken-grotesk-latin-wght-normal.woff2') format('woff2-variations');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    body { background: #f3f4f6; }
    /* The boot loader stays until main.ts adds .app-ready (app, first page and fonts ready), not after a fixed delay. */
    #app-boot-loader { position: fixed; inset: 0; z-index: 9999; }
    app-root { display: block; opacity: 0; }
    html.app-ready app-root { opacity: 1; transition: opacity 150ms ease-out; }
  </style>
</head>
<body>
  <style>
    #app-boot-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f3f4f6;
      gap: 16px;
    }
    #app-boot-loader .spinner {
      width: 80px;
      height: 80px;
      border: 6px solid #e5e7eb;
      border-top-color: #180393;
      border-radius: 50%;
      animation: boot-spin 0.75s linear infinite;
    }
    #app-boot-loader .label {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: #9ca3af;
      text-transform: uppercase;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <div id="app-boot-loader">
    <div class="spinner"></div>
    <span class="label">SIGPRO</span>
  </div>
  <app-root></app-root>
</body>
</html>
