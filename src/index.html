<!doctype html>
<html lang="es" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <title>SIGPRO</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Hanken Grotesk is served from this origin and preloaded, so it is requested with the HTML instead of after the CSS. -->
  <link rel="preload" href="fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Hanken Grotesk';
      font-style: normal;
      font-display: swap;
      font-weight: 100 900;
      src: url('/fonts/hanken-grotesk-latin-wght-normal.woff2') format('woff2-variations');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    body { background: #f3f4f6; }
    /* The boot loader stays until main.ts adds .app-ready (app, first page and fonts ready), not after a fixed delay. */
    #app-boot-loader { position: fixed; inset: 0; z-index: 9999; }
    app-root { display: block; opacity: 0; }
    html.app-ready app-root { opacity: 1; transition: opacity 150ms ease-out; }
  </style>
</head>
<body>
  <style>
    #app-boot-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f3f4f6;
    }
    #app-boot-loader .tiles {
      --s: clamp(36px, 11vw, 64px);
      display: flex;
      gap: calc(var(--s) * 0.14);
    }
    #app-boot-loader .tile {
      width: var(--s);
      height: var(--s);
      border-radius: 14%;
      background: #180393;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Hanken Grotesk', sans-serif;
      font-weight: 700;
      font-size: calc(var(--s) * 0.78);
      line-height: 1;
      opacity: 0;
      will-change: transform, opacity;
      animation: 3s linear infinite;
    }
    #app-boot-loader .tile:nth-child(1) { animation-name: boot-tile-0; }
    #app-boot-loader .tile:nth-child(2) { animation-name: boot-tile-1; }
    #app-boot-loader .tile:nth-child(3) { animation-name: boot-tile-2; }
    #app-boot-loader .tile:nth-child(4) { animation-name: boot-tile-3; }
    #app-boot-loader .tile:nth-child(5) { animation-name: boot-tile-4; }
    #app-boot-loader .tile:nth-child(6) { animation-name: boot-tile-5; }
    @keyframes boot-tile-0 {
      0%, 0% { transform: translateY(-70vh); opacity: 0; animation-timing-function: cubic-bezier(.55,0,1,.45); }
      0.33% { opacity: 1; }
      10% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.6,.4,1); }
      14% { transform: translateY(-14px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
      18% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.6,.4,1); }
      20% { transform: translateY(-4px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
      22%, 85% { transform: translateY(0); opacity: 1; }
      93.33%, 100% { transform: translateY(0); opacity: 0; }
    }
    @keyframes boot-tile-1 {
      0%, 8.67% { transform: translateY(-70vh); opacity: 0; animation-timing-function: cubic-bezier(.55,0,1,.45); }
      9% { opacity: 1; }
      18.67% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.6,.4,1); }
      22.67% { transform: translateY(-14px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
      26.67% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.6,.4,1); }
      28.67% { transform: translateY(-4px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
      30.67%, 85% { transform: translateY(0); opacity: 1; }
      93.33%, 100% { transform: translateY(0); opacity: 0; }
    }
    @keyframes boot-tile-2 {
      0%, 17.33% { transform: translateY(-70vh); opacity: 0; animation-timing-function: cubic-bezier(.55,0,1,.45); }
      17.67% { opacity: 1; }
      27.33% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.6,.4,1); }
      31.33% { transform: translateY(-14px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
      35.33% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.6,.4,1); }
      37.33% { transform: translateY(-4px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
      39.33%, 85% { transform: translateY(0); opacity: 1; }
      93.33%, 100% { transform: translateY(0); opacity: 0; }
    }
    @keyframes boot-tile-3 {
      0%, 26% { transform: translateY(-70vh); opacity: 0; animation-timing-function: cubic-bezier(.55,0,1,.45); }
      26.33% { opacity: 1; }
      36% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.6,.4,1); }
      40% { transform: translateY(-14px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
      44% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.6,.4,1); }
      46% { transform: translateY(-4px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
      48%, 85% { transform: translateY(0); opacity: 1; }
      93.33%, 100% { transform: translateY(0); opacity: 0; }
    }
    @keyframes boot-tile-4 {
      0%, 34.67% { transform: translateY(-70vh); opacity: 0; animation-timing-function: cubic-bezier(.55,0,1,.45); }
      35% { opacity: 1; }
      44.67% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.6,.4,1); }
      48.67% { transform: translateY(-14px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
      52.67% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.6,.4,1); }
      54.67% { transform: translateY(-4px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
      56.67%, 85% { transform: translateY(0); opacity: 1; }
      93.33%, 100% { transform: translateY(0); opacity: 0; }
    }
    @keyframes boot-tile-5 {
      0%, 43.33% { transform: translateY(-70vh); opacity: 0; animation-timing-function: cubic-bezier(.55,0,1,.45); }
      43.67% { opacity: 1; }
      53.33% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.6,.4,1); }
      57.33% { transform: translateY(-14px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
      61.33% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.6,.4,1); }
      63.33% { transform: translateY(-4px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
      65.33%, 85% { transform: translateY(0); opacity: 1; }
      93.33%, 100% { transform: translateY(0); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-boot-loader .tile { animation: none; opacity: 1; will-change: auto; }
    }

  </style>
  <div id="app-boot-loader">
    <div class="tiles" aria-label="SIGPRO"><span class="tile">S</span><span class="tile">I</span><span class="tile">G</span><span class="tile">P</span><span class="tile">R</span><span class="tile">O</span></div>
  </div>
  <app-root></app-root>
</body>
</html>
