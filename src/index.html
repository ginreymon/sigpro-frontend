<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SIGPRO</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/5d418fc590.js" crossorigin="anonymous"></script>
  <style>
    body { background: #f3f4f6; }
    #app-boot-loader { position: fixed; inset: 0; z-index: 9999; animation: loaderHide 0ms 350ms forwards; }
    app-root { display: block; opacity: 0; animation: appReveal 0ms 350ms forwards; }
    @keyframes loaderHide { to { opacity: 0; pointer-events: none; } }
    @keyframes appReveal { to { opacity: 1; } }
  </style>
</head>
<body>
  <style>
    #app-boot-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f3f4f6;
      gap: 16px;
    }
    #app-boot-loader .spinner {
      width: 80px;
      height: 80px;
      border: 6px solid #e5e7eb;
      border-top-color: #180393;
      border-radius: 50%;
      animation: boot-spin 0.75s linear infinite;
    }
    #app-boot-loader .label {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: #9ca3af;
      text-transform: uppercase;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <div id="app-boot-loader">
    <div class="spinner"></div>
    <span class="label">SIGPRO</span>
  </div>
  <app-root></app-root>
</body>
</html>
